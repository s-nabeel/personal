    <style>
      :root {
        --bg-color: #101014;
        --text-color: #f5f5f7;
        --muted-color: #a1a1a8;
        --sheen-hi: rgba(255, 255, 255, 0.16);
        --sheen-mid: rgba(255, 255, 255, 0.05);
        --sheen-rim: rgba(255, 255, 255, 0.28);
        --pill-bg: rgba(255, 255, 255, 0.08);
      }
      [data-theme="light"] {
        --bg-color: #ececee;
        --text-color: #111114;
        --muted-color: #6e6e75;
        --sheen-hi: rgba(255, 255, 255, 0.5);
        --sheen-mid: rgba(255, 255, 255, 0.14);
        --sheen-rim: rgba(255, 255, 255, 0.9);
        --pill-bg: rgba(255, 255, 255, 0.62);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        user-select: none;
        -webkit-user-select: none;
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter",
          "Helvetica Neue", Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      html {
        background-color: var(--bg-color);
      }
      body {
        background-color: var(--bg-color);
        color: var(--text-color);
        overscroll-behavior-y: none;
      }

      ::view-transition-old(root),
      ::view-transition-new(root) {
        animation-duration: 0.45s;
        animation-timing-function: ease-in-out;
      }

      .main-content {
        position: relative;
        background: var(--bg-color);
      }
      .banner-text-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        max-width: 60%;
        margin: 0 auto;
        padding-top: 90svh;
        padding-bottom: calc(50svh - 1.6rem);
      }
      .toolbar-cover {
        position: sticky;
        top: 0;
        height: 100lvh;
        margin-bottom: -100lvh;
        z-index: 5;
        pointer-events: none;
      }
      .toolbar-cover::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: calc(100lvh - 100svh);
        background: var(--bg-color);
      }
      .banner-text {
        width: 100%;
        text-align: center;
        margin: 20vh auto;
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter",
          "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-size: 7vw;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: -0.02em;
        line-height: 0.9;
        color: var(--text-color);
        pointer-events: none;
      }
      .banner-text.small {
        font-size: 3.4vw;
        font-weight: 600;
        letter-spacing: -0.01em;
        line-height: 1;
        color: var(--muted-color);
      }
      .banner-text {
        position: relative;
      }
      .banner-text span {
        font-family: inherit;
      }
      .banner-text .stripes {
        display: none;
        position: absolute;
        inset: 0.4em 0 0.8em;
      }
      .banner-text.retro .word {
        color: transparent;
      }
      .banner-text.retro .stripes {
        display: block;
      }
      .band {
        position: absolute;
        left: 0;
        right: 0;
        height: calc(100% / 6);
        overflow: hidden;
        text-align: center;
      }
      .band > span {
        position: absolute;
        left: 0;
        right: 0;
        height: 600%;
      }
      .band:nth-child(1) { top: 0;                 color: #61bb46; }
      .band:nth-child(2) { top: calc(100% / 6);     color: #fdb827; }
      .band:nth-child(3) { top: calc(200% / 6);     color: #f5821f; }
      .band:nth-child(4) { top: calc(300% / 6);     color: #e03a3e; }
      .band:nth-child(5) { top: calc(400% / 6);     color: #963d97; }
      .band:nth-child(6) { top: calc(500% / 6);     color: #009ddc; }
      .band:nth-child(1) > span { top: 0; }
      .band:nth-child(2) > span { top: -100%; }
      .band:nth-child(3) > span { top: -200%; }
      .band:nth-child(4) > span { top: -300%; }
      .band:nth-child(5) > span { top: -400%; }
      .band:nth-child(6) > span { top: -500%; }
      #name {
        padding: 0.4em 0 0.8em;
        margin: calc(20vh - 0.4em) auto calc(20vh - 0.8em);
      }
      .banner-text .word {
        position: relative;
        z-index: 1;
      }
      .banner-text .a {
        position: relative;
        display: inline-block;
      }
      .banner-text .leaf {
        display: none;
        position: absolute;
        left: calc(50% - 0.09em);
        top: -0.31em;
        width: 0.26em;
        height: 0.3em;
      }
      .banner-text.retro .leaf {
        display: block;
      }
      .banner-text .leaf-fly {
        display: none;
        position: absolute;
        left: calc(50% - 0.09em);
        top: -0.31em;
        width: 0.26em;
        height: 0.3em;
      }
      .banner-text .leaf-fly.on {
        display: block;
      }
      .banner-text .leaf-fly img {
        display: none;
        position: absolute;
        left: -50%;
        top: -50%;
        width: 200%;
        height: 200%;
      }
      .banner-text .i {
        display: none;
        text-transform: none;
      }
      .banner-text.crashed .i {
        display: inline;
      }
      .banner-text .runner {
        display: none;
        position: absolute;
        top: 0.4em;
        left: -60vw;
        text-transform: none;
        color: var(--text-color);
        white-space: nowrap;
      }
      .banner-text .runner.running {
        display: block;
      }
      .banner-text .runner .stripes {
        inset: 0;
      }

      .shape {
        position: fixed;
        top: 10vw;
        left: 10vw;
        width: calc(100vw - 20vw);
        height: calc(100vh - 20vw);
        border-radius: 2vw;
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(20px) saturate(180%);
        will-change: transform;
        pointer-events: auto;
        z-index: 9999;
      }

      .mask {
        position: fixed;
        top: 10vw;
        left: 10vw;
        width: calc(100vw - 20vw);
        height: calc(100vh - 20vw);
        border-radius: 2vw;
        box-shadow: 0 0 0 200vmax var(--bg-color);
        pointer-events: none;
        z-index: 9990;
      }

      .lens {
        position: relative;
        overflow: clip;
        will-change: transform;
      }
      .lens::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        z-index: 2;
        pointer-events: none;
        background: linear-gradient(
          125deg,
          var(--sheen-hi) 0%,
          var(--sheen-mid) 34%,
          rgba(255, 255, 255, 0) 62%
        );
        box-shadow: inset 0 1px 1px var(--sheen-rim);
      }
      .lens > * {
        position: relative;
        z-index: 3;
      }

      .top-nav {
        position: fixed;
        top: 0;
        right: 0;
        padding: 32px 40px;
        z-index: 10000;
      }
      #theme-toggle {
        width: 53px;
        height: 53px;
        border: none;
        background: var(--pill-bg);
        -webkit-backdrop-filter: blur(14px) saturate(160%);
        backdrop-filter: blur(14px) saturate(160%);
        box-shadow:
          0 10px 30px rgba(0, 0, 0, 0.1),
          0 0 0 0.5px rgba(0, 0, 0, 0.05);
        border-radius: 999px;
        color: var(--text-color);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        outline: none;
        -webkit-tap-highlight-color: transparent;
        transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      #theme-toggle:hover {
        transform: scale(1.04);
      }
      #theme-toggle:active {
        transform: scale(0.97);
      }
      #theme-toggle svg {
        position: absolute;
        z-index: 3;
        width: 17px;
        height: 17px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
        transition:
          transform 0.6s cubic-bezier(0.4, 0, 0.2, 1),
          opacity 0.4s ease;
      }
      #sun-icon {
        opacity: 1;
        transform: rotate(0deg);
      }
      #moon-icon {
        opacity: 0;
        transform: rotate(-90deg);
      }
      [data-theme="light"] #sun-icon {
        opacity: 0;
        transform: rotate(90deg);
      }
      [data-theme="light"] #moon-icon {
        opacity: 1;
        transform: rotate(0deg);
      }

      .scroll-hint {
        position: absolute;
        left: 0;
        right: 0;
        top: 50svh;
        margin-top: -1.35em;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.35em;
        color: var(--muted-color);
        font-size: clamp(16px, 1.9vw, 30px);
        font-weight: 500;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        pointer-events: none;
      }
      .scroll-hint .arrow {
        display: block;
        width: 1em;
        height: 1em;
        animation: nudge 1.8s ease-in-out infinite;
      }
      .scroll-hint .arrow-light,
      [data-theme="light"] .scroll-hint .arrow-dark {
        display: none;
      }
      [data-theme="light"] .scroll-hint .arrow-light {
        display: block;
      }
      @keyframes nudge {
        0%,
        100% {
          margin-top: 0;
          opacity: 0.9;
        }
        50% {
          margin-top: 0.3em;
          opacity: 0.4;
        }
      }
      .email-wrap {
        display: block;
        position: relative;
        width: 12rem;
        height: 3.2rem;
        margin: 24vh auto 0;
        color: var(--text-color);
        text-decoration: none;
        pointer-events: auto;
        cursor: pointer;
      }
      .email-wrap:hover {
        --pill-bg: rgba(255, 255, 255, 0.12);
        --sheen-rim: rgba(255, 255, 255, 0.38);
      }
      [data-theme="light"] .email-wrap:hover {
        --pill-bg: rgba(255, 255, 255, 0.8);
      }
      .email-wrap svg {
        display: block;
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      .email-wrap .pill-bg {
        fill: var(--pill-bg);
      }
      .email-wrap .pill-rim {
        fill: none;
        stroke: var(--sheen-rim);
        stroke-width: 1;
      }
      .email-wrap .pill-sheen {
        fill: var(--sheen-mid);
      }
      .email-wrap span {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-color);
        font-size: 0.98rem;
        font-weight: 500;
        letter-spacing: -0.01em;
      }

      footer.lens {
        position: fixed;
        left: 24px;
        right: 24px;
        bottom: calc(24px + env(safe-area-inset-bottom));
        z-index: 10000;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1.05rem 2rem;
        border-radius: 999px;
        background: var(--pill-bg);
        -webkit-backdrop-filter: blur(14px) saturate(160%);
        backdrop-filter: blur(14px) saturate(160%);
        box-shadow:
          0 10px 30px rgba(0, 0, 0, 0.1),
          0 0 0 0.5px rgba(0, 0, 0, 0.05);
        color: var(--muted-color);
        font-size: 0.78rem;
        font-weight: 500;
        letter-spacing: 0.01em;
      }
      #clock-wrap {
        pointer-events: auto;
        cursor: pointer;
      }

      @media (max-width: 768px) {
        .shape,
        .mask {
          position: fixed;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
          width: calc(80vw);
          height: calc(50vh);
          border-radius: 4vw;
        }
        .banner-text-container {
          max-width: 78%;
        }
        .banner-text {
          font-size: 14vw;
          margin: 16vh auto;
        }
        #name {
          margin: calc(16vh - 0.4em) auto calc(16vh - 0.8em);
        }
        .banner-text.small {
          font-size: 5.2vw;
          line-height: 1.12;
          max-width: 60vw;
          text-wrap: balance;
        }
        .scroll-hint {
          font-size: 4.2vw;
        }
        .top-nav {
          padding: calc(14px + env(safe-area-inset-top)) 18px 18px;
        }
        #theme-toggle {
          width: 48px;
          height: 48px;
        }
        .email-wrap {
          width: 10.5rem;
          height: 3rem;
          margin-top: 18vh;
        }
        .email-wrap span {
          font-size: 0.92rem;
        }
        footer.lens {
          left: 14px;
          right: 14px;
          bottom: calc(14px + env(safe-area-inset-bottom));
          padding: 0.85rem 1.2rem;
          font-size: 0.68rem;
          gap: 12px;
        }
      }
    </style>

    <script>
      const root = document.documentElement;
      const themeToggle = document.getElementById("theme-toggle");
      function syncChrome() {
        const light = root.getAttribute("data-theme") === "light";
        document
          .getElementById("theme-color")
          .setAttribute("content", light ? "#ececee" : "#101014");
      }
      let transitionBusy = false;
      function transitionWith(apply) {
        if (transitionBusy) return;
        const recapture = async () => {
          const r = window.__liquidGLRenderer__;
          if (r && r.captureSnapshot) await r.captureSnapshot();
        };
        if (document.startViewTransition) {
          transitionBusy = true;
          const vt = document.startViewTransition(async () => {
            apply();
            await recapture();
          });
          vt.ready.catch(() => {});
          vt.updateCallbackDone.catch(() => {});
          return vt.finished
            .catch(() => {})
            .finally(() => (transitionBusy = false));
        }
        apply();
        return recapture();
      }
      function setTheme(theme) {
        transitionWith(() => {
          if (theme === "dark") root.removeAttribute("data-theme");
          else root.setAttribute("data-theme", "light");
          localStorage.setItem("theme", theme);
          syncChrome();
        });
      }
      if (localStorage.getItem("theme") === "light") root.setAttribute("data-theme", "light");
      syncChrome();
      themeToggle.addEventListener("click", () =>
        setTheme(root.getAttribute("data-theme") === "light" ? "dark" : "light"),
      );

      const fireworks = confetti.create(null, { resize: true, useWorker: false });
      function fireworksShow() {
        const end = Date.now() + 2500;
        const colors = ["#ff2d78", "#ff7a1a", "#b06bff", "#4db8ff", "#ffffff"];
        (function fire() {
          fireworks({
            particleCount: 45,
            startVelocity: 32,
            spread: 360,
            ticks: 70,
            gravity: 0.9,
            origin: { x: 0.15 + Math.random() * 0.7, y: 0.15 + Math.random() * 0.4 },
            colors,
            zIndex: 20000,
            disableForReducedMotion: true,
          });
          if (Date.now() < end) setTimeout(fire, 180 + Math.random() * 140);
        })();
      }

      const nameEl = document.getElementById("name");
      const runner = document.getElementById("runner");
      const wordEl = nameEl.querySelector(".word");
      const leafEl = nameEl.querySelector(".leaf");
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

      function liveNode(el, on) {
        const r = window.__liquidGLRenderer__;
        if (!r) return;
        if (on) {
          liquidGL.registerDynamic(el);
          return;
        }
        r._dynamicNodes = r._dynamicNodes.filter((n) => n.el !== el);
        r._dynMeta?.delete(el);
      }

      function forceLive(els) {
        const r = window.__liquidGLRenderer__;
        if (!r) return;
        els.forEach((el) => {
          const m = r._dynMeta?.get(el);
          if (m) m.needsRecapture = true;
        });
        r.render();
      }

      async function bringNameIntoPane() {
        const rect = nameEl.getBoundingClientRect();
        const centre = rect.top + rect.height / 2;
        if (centre > innerHeight * 0.36 && centre < innerHeight * 0.64) return;
        window.scrollTo({ top: scrollY + centre - innerHeight / 2, behavior: "smooth" });
        await sleep(900);
      }

      let crashBusy = false;
      async function appleShow() {
        if (crashBusy) return;
        crashBusy = true;
        const r = window.__liquidGLRenderer__;
        if (nameEl.classList.contains("crashed")) {
          await appleUndo();
          crashBusy = false;
          return;
        }
        await bringNameIntoPane();
        nameEl.setAttribute("data-liquidgl-hide", "");
        if (r) await r.captureSnapshot();
        liveNode(nameEl, true);
        liveNode(runner, true);
        nameEl.classList.add("retro");

        let animating = true;
        (function tick() {
          if (!animating) return;
          forceLive([nameEl, runner]);
          requestAnimationFrame(tick);
        })();

        runner.classList.add("running");
        const wordRect = wordEl.getBoundingClientRect();
        const nameRect = nameEl.getBoundingClientRect();
        const runnerW = runner.getBoundingClientRect().width;
        const stopLeft = wordRect.left - nameRect.left - runnerW;
        await runner.animate(
          [{ left: "-60vw" }, { left: `${stopLeft}px` }],
          { duration: 620, easing: "cubic-bezier(0.7, 0, 1, 1)", fill: "forwards" },
        ).finished;

        runner.classList.remove("running");
        nameEl.classList.add("crashed");
        const hit = wordEl.getBoundingClientRect();
        fireworks({
          particleCount: 28,
          spread: 75,
          startVelocity: 26,
          ticks: 55,
          gravity: 1,
          scalar: 0.8,
          origin: { x: hit.left / innerWidth, y: (hit.top + hit.height * 0.55) / innerHeight },
          colors: ["#61bb46", "#fdb827", "#f5821f", "#e03a3e", "#963d97", "#009ddc"],
          zIndex: 20000,
          disableForReducedMotion: true,
        });
        leafEl.animate(
          [{ top: "-0.31em" }, { top: "-0.78em", offset: 0.4 }, { top: "-0.31em" }],
          { duration: 560, easing: "cubic-bezier(0.34, 1.56, 0.64, 1)" },
        );
        await nameEl.animate(
          [
            { left: "0px" },
            { left: "0.28em", offset: 0.18 },
            { left: "-0.12em", offset: 0.45 },
            { left: "0.05em", offset: 0.72 },
            { left: "0px" },
          ],
          { duration: 760, easing: "ease-out" },
        ).finished;

        animating = false;
        liveNode(nameEl, false);
        liveNode(runner, false);
        nameEl.removeAttribute("data-liquidgl-hide");
        if (r) await r.captureSnapshot();
        crashBusy = false;
      }

      const LEAF_PATH =
        "M62.2 66.8c14.6-17.7 24.5-42.3 21.8-66.8-21.1.9-46.6 14.1-61.7 31.8-13.5 15.7-25.3 40.7-22.1 64.7 23.5 1.8 47.4-12 62-29.7z";
      const LEAF_ANGLES = 36;
      const LEAF_FLIPS = [1, 0.72, 0.42];
      const leafFly = document.createElement("span");
      leafFly.className = "leaf-fly";
      leafFly.setAttribute("aria-hidden", "true");
      const leafFrames = [];
      for (let a = 0; a < LEAF_ANGLES; a++) {
        for (let f = 0; f < LEAF_FLIPS.length; f++) {
          const deg = (a * 360) / LEAF_ANGLES - 180;
          const svg =
            `<svg xmlns='http://www.w3.org/2000/svg' viewBox='-30 -30 145 158'>` +
            `<g transform='translate(42.5 49) rotate(${deg}) scale(${LEAF_FLIPS[f]} 1) translate(-42.5 -49)'>` +
            `<path fill='#61bb46' d='${LEAF_PATH}'/></g></svg>`;
          const img = document.createElement("img");
          img.alt = "";
          img.src = "data:image/svg+xml;utf8," + encodeURIComponent(svg);
          leafFly.appendChild(img);
          leafFrames.push(img);
        }
      }
      leafEl.parentNode.appendChild(leafFly);
      let leafShown = null;
      function showLeafFrame(angle, flip) {
        let a = Math.round(((angle + 180) / 360) * LEAF_ANGLES) % LEAF_ANGLES;
        if (a < 0) a += LEAF_ANGLES;
        let f = 0;
        for (let i = 1; i < LEAF_FLIPS.length; i++) {
          if (Math.abs(flip - LEAF_FLIPS[i]) < Math.abs(flip - LEAF_FLIPS[f])) f = i;
        }
        const img = leafFrames[a * LEAF_FLIPS.length + f];
        if (img === leafShown) return;
        if (leafShown) leafShown.style.display = "";
        img.style.display = "block";
        leafShown = img;
      }
      function resetLeaf() {
        leafEl.style.display = "";
        leafFly.classList.remove("on");
        leafFly.style.left = "";
        leafFly.style.top = "";
        if (leafShown) leafShown.style.display = "";
        leafShown = null;
      }
      function fallLeaf() {
        return new Promise((resolve) => {
          const em = parseFloat(getComputedStyle(nameEl).fontSize);
          const aBox = nameEl.querySelector(".a").getBoundingClientRect();
          const startX = aBox.width / 2 - 0.09 * em;
          const startY = -0.31 * em;
          const groundY = 0.96 * em;
          const total = 2500;
          const omega = (Math.PI * 2) / 950;
          let t0 = null;
          let landed = null;
          let restX = 0;
          let restAngle = 0;
          leafEl.style.display = "none";
          leafFly.classList.add("on");
          const step = (ts) => {
            if (t0 === null) t0 = ts;
            const t = ts - t0;
            const u = Math.min(t / total, 1);
            const lift = Math.min(t / 300, 1);
            const amp = (0.5 + 0.8 * u) * em;
            const drift = (-0.15 + 1.35 * u * u) * em;
            const sway = Math.sin(omega * t);
            const swayV = Math.cos(omega * t);
            let x = startX + drift + amp * sway * lift;
            const rise = -0.2 * em * Math.sin(Math.PI * Math.min(t / 520, 1));
            const speed = 0.12 + 0.34 * Math.abs(swayV);
            const fallY = (groundY - startY) * Math.pow(u, 1.2) * (0.72 + 0.28 * speed / 0.46);
            let y = startY + rise + fallY;
            const vx = amp * omega * swayV;
            let angle = -swayV * 46 + 9 * Math.sin(omega * 2.3 * t);
            const flip = 0.35 + 0.65 * Math.abs(Math.cos(omega * 0.5 * t + 0.6));
            if (y >= groundY || u >= 1) {
              if (landed === null) {
                landed = t;
                restX = x;
                restAngle = angle > 0 ? 62 : -62;
              }
              const k = Math.min((t - landed) / 240, 1);
              const ease = 1 - Math.pow(1 - k, 3);
              y = groundY;
              x = restX + 0.08 * em * ease * Math.sign(vx || 1);
              angle = angle + (restAngle - angle) * ease;
              leafFly.style.left = `${x}px`;
              leafFly.style.top = `${y}px`;
              showLeafFrame(angle, 1);
              if (k >= 1 && t - landed > 120) return resolve();
              requestAnimationFrame(step);
              return;
            }
            leafFly.style.left = `${x}px`;
            leafFly.style.top = `${y}px`;
            showLeafFrame(angle, flip);
            requestAnimationFrame(step);
          };
          requestAnimationFrame(step);
        });
      }

      async function appleUndo() {
        const r = window.__liquidGLRenderer__;
        await bringNameIntoPane();
        nameEl.setAttribute("data-liquidgl-hide", "");
        if (r) await r.captureSnapshot();
        liveNode(nameEl, true);
        liveNode(runner, true);
        let animating = true;
        (function tick() {
          if (!animating) return;
          forceLive([nameEl, runner]);
          requestAnimationFrame(tick);
        })();

        const iRect = wordEl.querySelector(".i").getBoundingClientRect();
        const nameRect = nameEl.getBoundingClientRect();
        runner.style.left = `${iRect.left - nameRect.left}px`;
        runner.classList.add("running");
        nameEl.classList.remove("crashed");
        const leave = runner.animate(
          [{ left: runner.style.left }, { left: "-60vw" }],
          { duration: 640, easing: "cubic-bezier(0.6, 0, 1, 1)", fill: "forwards" },
        ).finished;
        nameEl.animate(
          [{ left: "0px" }, { left: "-0.14em", offset: 0.25 }, { left: "0px" }],
          { duration: 520, easing: "ease-out" },
        );
        const drop = fallLeaf();
        await leave;
        runner.classList.remove("running");
        runner.style.left = "";
        await drop;

        animating = false;
        liveNode(nameEl, false);
        liveNode(runner, false);
        nameEl.removeAttribute("data-liquidgl-hide");
        await transitionWith(() => {
          nameEl.classList.remove("retro");
          leafEl.getAnimations().forEach((a) => a.cancel());
          resetLeaf();
        });
      }

      const paneEl = document.querySelector(".shape");
      const hintEl = document.getElementById("scroll-hint");
      function inside(e, r, pad) {
        return (
          e.clientX >= r.left - pad &&
          e.clientX <= r.right + pad &&
          e.clientY >= r.top - pad &&
          e.clientY <= r.bottom + pad
        );
      }
      function overHint(e) {
        const r = hintEl.getBoundingClientRect();
        return r.bottom > 0 && inside(e, r, 16);
      }
      document.addEventListener("mousemove", (e) => {
        document.body.style.cursor = overHint(e) ? "pointer" : "";
      });
      document.addEventListener("click", (e) => {
        if (e.target.closest("a, button")) return;
        if (!overHint(e)) return;
        const rect = nameEl.getBoundingClientRect();
        window.scrollTo({
          top: scrollY + rect.top + rect.height / 2 - innerHeight / 2,
          behavior: "smooth",
        });
      });

      let tapCount = 0;
      let tapTimer = null;
      document.addEventListener("pointerup", (e) => {
        if (e.target.closest("a, button")) return;
        if (!inside(e, paneEl.getBoundingClientRect(), 0)) return;
        tapCount += 1;
        clearTimeout(tapTimer);
        tapTimer = setTimeout(() => (tapCount = 0), 500);
        if (tapCount === 3) {
          tapCount = 0;
          appleShow();
        }
      });

      let inputBuffer = "";
      const secrets = {
        dark: () => setTheme("dark"),
        light: () => setTheme("light"),
        nabeel: fireworksShow,
        apple: appleShow,
      };
      window.addEventListener("keydown", (e) => {
        if (e.key.length !== 1) return;
        inputBuffer = (inputBuffer + e.key.toLowerCase()).slice(-10);
        for (const word in secrets) {
          if (inputBuffer.includes(word)) {
            secrets[word]();
            inputBuffer = "";
          }
        }
      });

      document.getElementById("year").textContent = new Date().getFullYear();
      let clockZone = "America/Los_Angeles";
      const clockWrap = document.getElementById("clock-wrap");
      clockWrap.addEventListener("click", () => {
        clockZone = clockZone === "UTC" ? "America/Los_Angeles" : "UTC";
        clockWrap.firstChild.textContent =
          clockZone === "UTC" ? "\n        UTC. " : "\n        San Francisco, CA. ";
        updateClock();
      });
      function updateClock() {
        document.getElementById("clock").textContent = new Intl.DateTimeFormat([], {
          timeZone: clockZone,
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hour12: false,
        }).format(new Date());
      }
      setInterval(updateClock, 1000);
      updateClock();

      document.addEventListener("DOMContentLoaded", () => {
        if (typeof liquidGL !== "function") return;
        liquidGL({
          target: ".shape",
          snapshot: ".main-content",
          refraction: 0.026,
          bevelDepth: 0.119,
          bevelWidth: 0.057,
          frost: 0,
          specular: true,
          shadow: true,
          reveal: "fade",
        });
        liquidGL.registerDynamic("#scroll-hint");
        liquidGL.registerDynamic("#email");
        let resizeTimer = null;
        window.addEventListener("resize", () => {
          clearTimeout(resizeTimer);
          resizeTimer = setTimeout(() => {
            forceLive([document.getElementById("scroll-hint")]);
          }, 600);
        });
        window.addEventListener("load", () => liquidGL.syncWith());
        document.addEventListener("mousemove", () => {
          if (window.__liquidGLRenderer__) window.__liquidGLRenderer__.render();
        });
        let settleTimer = null;
        document.addEventListener("scroll", () => {
          const r = window.__liquidGLRenderer__;
          if (!r) return;
          r.render();
          clearTimeout(settleTimer);
          settleTimer = setTimeout(() => {
            r.render();
            setTimeout(() => r.render(), 300);
          }, 320);
        });
      });

      console.log(
        "%cNABEEL",
        "color: #ffffff; font-family: monospace; font-size: 24px; font-weight: bold; padding: 10px 0;",
      );
      console.log(
        "%cYou found the console. Try typing 'apple' on the page ;)",
        "color: #a3a3a3; font-family: monospace; font-size: 12px;",
      );
    </script>
  </body>
</html>
