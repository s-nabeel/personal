<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Nabeel</title>

    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="favicon.png" />

    <meta name="title" content="Nabeel" />
    <meta name="description" content="Personal site of Nabeel." />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nabeel.ca/" />
    <meta property="og:title" content="Nabeel" />
    <meta property="og:description" content="Personal site of Nabeel." />
    <meta property="og:image" content="https://nabeel.ca/og-image.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://nabeel.ca/" />
    <meta name="twitter:title" content="Nabeel" />
    <meta name="twitter:description" content="Personal site of Nabeel." />
    <meta name="twitter:image" content="https://nabeel.ca/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=EB+Garamond:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-color: #0b0d12;
        --text-color: #f5f5f7;
        --footer-color: #86868b;
        --link-color: #d6d6da;
        --border-color: rgba(255, 255, 255, 0.24);

        /* liquid glass tokens */
        --glass-bg: rgba(255, 255, 255, 0.08);
        --glass-bg-strong: rgba(255, 255, 255, 0.12);
        --glass-stroke: rgba(255, 255, 255, 0.18);
        --glass-highlight: rgba(255, 255, 255, 0.4);
        --glass-shadow: 0 24px 70px rgba(0, 0, 0, 0.5),
          0 2px 8px rgba(0, 0, 0, 0.25);
        --glass-inner: inset 0 1px 0 rgba(255, 255, 255, 0.22),
          inset 0 -1px 0 rgba(255, 255, 255, 0.05);
        --blob-a: rgba(75, 115, 250, 0.34);
        --blob-b: rgba(0, 185, 215, 0.22);
        --blob-c: rgba(130, 100, 255, 0.22);
        --glint-core: rgba(255, 255, 255, 0.95);
        --glint-mid: rgba(255, 255, 255, 0.3);
      }

      [data-theme="light"] {
        --bg-color: #eef0f4;
        --text-color: #0a0a0a;
        --footer-color: #55555a;
        --link-color: #3a3a40;
        --border-color: rgba(0, 0, 0, 0.18);

        --glass-bg: rgba(255, 255, 255, 0.42);
        --glass-bg-strong: rgba(255, 255, 255, 0.55);
        --glass-stroke: rgba(255, 255, 255, 0.65);
        --glass-highlight: rgba(255, 255, 255, 0.95);
        --glass-shadow: 0 20px 50px rgba(40, 50, 90, 0.16),
          0 2px 10px rgba(40, 50, 90, 0.08);
        --glass-inner: inset 0 1px 0 rgba(255, 255, 255, 0.9),
          inset 0 -1px 0 rgba(255, 255, 255, 0.35);
        --blob-a: rgba(70, 110, 245, 0.18);
        --blob-b: rgba(0, 180, 210, 0.14);
        --blob-c: rgba(150, 140, 255, 0.14);
        --glint-core: rgba(60, 80, 215, 1);
        --glint-mid: rgba(60, 80, 215, 0.4);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        /* Apple's newest font: real SF Pro on Apple devices, Inter elsewhere */
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter",
          "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-style: normal !important;
        -webkit-font-smoothing: antialiased;
      }

      html,
      body {
        height: 100%;
        width: 100%;
        overflow: hidden;
        position: fixed;
      }

      body {
        background-color: var(--bg-color);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: var(--text-color);
        transition:
          background-color 0.4s ease,
          color 0.4s ease;
      }

      /* ambient color field the glass refracts */
      .ambient {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        overflow: hidden;
      }
      .ambient::before,
      .ambient::after,
      .ambient .blob {
        content: "";
        position: absolute;
        width: 55vmax;
        height: 55vmax;
        border-radius: 50%;
        filter: blur(90px);
        will-change: transform;
      }
      .ambient::before {
        background: var(--blob-a);
        top: -20vmax;
        left: -15vmax;
        animation: drift-a 26s ease-in-out infinite alternate;
      }
      .ambient::after {
        background: var(--blob-b);
        bottom: -25vmax;
        right: -15vmax;
        animation: drift-b 32s ease-in-out infinite alternate;
      }
      .ambient .blob {
        background: var(--blob-c);
        top: 40%;
        left: 55%;
        width: 40vmax;
        height: 40vmax;
        animation: drift-c 38s ease-in-out infinite alternate;
      }
      @keyframes drift-a {
        to {
          transform: translate(12vmax, 8vmax) scale(1.1);
        }
      }
      @keyframes drift-b {
        to {
          transform: translate(-10vmax, -6vmax) scale(1.15);
        }
      }
      @keyframes drift-c {
        to {
          transform: translate(-14vmax, -10vmax) scale(0.9);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .ambient::before,
        .ambient::after,
        .ambient .blob {
          animation: none;
        }
      }

      /* the liquid glass recipe */
      .glass {
        position: relative;
        background: var(--glass-bg);
        -webkit-backdrop-filter: blur(22px) saturate(180%);
        backdrop-filter: blur(22px) saturate(180%);
        border: 1px solid var(--glass-stroke);
        box-shadow: var(--glass-shadow), var(--glass-inner);
        transition:
          background 0.4s ease,
          border-color 0.4s ease,
          box-shadow 0.4s ease;
      }
      .glass::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        pointer-events: none;
        background:
          radial-gradient(
            45vmax circle at var(--spec-x, 30%) var(--spec-y, 20%),
            var(--glass-highlight) 0%,
            transparent 40%
          ),
          linear-gradient(
            135deg,
            var(--glass-highlight) 0%,
            transparent 22%,
            transparent 78%,
            rgba(255, 255, 255, 0.12) 100%
          );
        background-attachment: fixed, scroll;
        opacity: 0.22;
        transition: opacity 0.4s ease;
      }

      /* liquid glass rim glint — the border lights up near the cursor
         and glides along the edge */
      .glass::after,
      #theme-toggle::after,
      .home-link::after {
        content: "";
        position: absolute;
        inset: -1px;
        border-radius: inherit;
        pointer-events: none;
        padding: 2px;
        background: radial-gradient(
          160px circle at var(--mx, 50%) var(--my, 50%),
          var(--glint-core) 0%,
          var(--glint-mid) 40%,
          transparent 70%
        );
        -webkit-mask:
          linear-gradient(#000 0 0) content-box,
          linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
        mask:
          linear-gradient(#000 0 0) content-box,
          linear-gradient(#000 0 0);
        mask-composite: exclude;
        opacity: 0;
        transition: opacity 0.5s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .glass:hover::after,
      #theme-toggle:hover::after,
      .home-link:hover::after {
        opacity: 1;
      }

      /* gyroscope drives the glints on mobile — always lit, no hover needed */
      body.tilt-active .glass::after,
      body.tilt-active #theme-toggle::after,
      body.tilt-active .home-link::after {
        opacity: 0.8;
      }
      #theme-toggle,
      .home-link {
        position: relative;
      }

      .top-nav {
        position: fixed;
        top: 0;
        right: 0;
        padding: 40px 60px;
        z-index: 100;
      }

      #theme-toggle {
        background: var(--glass-bg);
        -webkit-backdrop-filter: blur(18px) saturate(180%);
        backdrop-filter: blur(18px) saturate(180%);
        border: 1px solid var(--glass-stroke);
        box-shadow: var(--glass-inner), 0 6px 20px rgba(0, 0, 0, 0.2);
        border-radius: 999px;
        color: var(--text-color);
        cursor: pointer;
        width: 44px;
        height: 44px;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        outline: none;
        -webkit-tap-highlight-color: transparent;
        transition:
          transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
          background 0.4s ease;
      }
      #theme-toggle:hover {
        transform: scale(1.08);
        background: var(--glass-bg-strong);
      }
      #theme-toggle:active {
        transform: scale(0.94);
      }

      #theme-toggle svg {
        position: absolute;
        width: 16px;
        height: 16px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        transition:
          transform 0.6s cubic-bezier(0.4, 0, 0.2, 1),
          opacity 0.4s ease;
      }

      #sun-icon {
        opacity: 1;
        transform: rotate(0deg);
      }
      #moon-icon {
        opacity: 0;
        transform: rotate(-90deg);
      }

      [data-theme="light"] #sun-icon {
        opacity: 0;
        transform: rotate(90deg);
      }
      [data-theme="light"] #moon-icon {
        opacity: 1;
        transform: rotate(0deg);
      }

      .content-wrapper {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        position: relative;
        width: 100%;
        z-index: 1;
      }

      .glass-card {
        border-radius: 32px;
        padding: 72px 96px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .name {
        /* Apple Garamond wordmark: EB Garamond condensed ~82% like Apple's cut */
        font-family: "EB Garamond", "Apple Garamond", Garamond, Georgia, serif;
        font-weight: 500;
        font-size: 4.8rem;
        line-height: 1.05;
        letter-spacing: -0.005em;
        transform: scaleX(0.82);
        transform-origin: center;
        user-select: none;
        cursor: pointer;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        transition:
          opacity 0.3s ease,
          transform 0.3s ease;
      }

      .name.fading {
        opacity: 0;
        transform: scaleX(0.82) translateY(5px);
      }

      /* apple leaf over the first "a": drops in, and the "a" bounces on impact */
      .apple-a {
        position: relative;
        display: inline-block;
        pointer-events: none;
        animation: a-bounce 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) 0.62s;
      }
      .apple-a::after {
        content: "";
        position: absolute;
        bottom: 0.56em;
        left: 58%;
        width: 0.2em;
        height: 0.22em;
        background: #61bb46;
        border-radius: 0 100% 0 100%;
        transform: translateX(-30%) rotate(30deg);
        pointer-events: none;
        animation: leaf-drop 0.55s cubic-bezier(0.5, 0, 0.7, 0.4) 0.15s both;
      }
      @keyframes leaf-drop {
        from {
          transform: translate(-30%, -0.6em) rotate(8deg);
          opacity: 0;
        }
        40% {
          opacity: 1;
        }
        to {
          transform: translateX(-30%) rotate(30deg);
          opacity: 1;
        }
      }
      @keyframes a-bounce {
        0% {
          transform: translateY(0);
        }
        35% {
          transform: translateY(0.07em) scaleY(0.93);
        }
        70% {
          transform: translateY(-0.03em);
        }
        100% {
          transform: translateY(0);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .apple-a,
        .apple-a::after {
          animation: none;
        }
      }

      .name span {
        font-family: inherit;
      }

      /* LoveFrom-style typewriter caret */
      .name .caret {
        display: inline-block;
        width: 1px;
        height: 0.9em;
        background: var(--text-color);
        margin-left: 6px;
        vertical-align: -0.08em;
        animation: blink 1.1s step-end infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0;
        }
      }
      .name .caret.done {
        animation: caret-out 0.6s ease forwards 1.2s;
      }
      @keyframes caret-out {
        to {
          opacity: 0;
        }
      }

      .reveal {
        opacity: 0;
        transform: translateY(8px);
        transition:
          opacity 0.9s ease,
          transform 0.9s ease;
      }
      .reveal.shown {
        opacity: 1;
        transform: translateY(0);
      }

      .tagline {
        margin-top: 20px;
        color: var(--footer-color);
        font-size: 1.05rem;
        font-weight: 400;
        letter-spacing: 0.005em;
        text-align: center;
        user-select: none;
      }

      /* retro six-color Apple stripes — secret */
      .name.retro #name-text,
      .name.retro #name-text .apple-a {
        background: linear-gradient(
          180deg,
          #61bb46 0% 16.6%,
          #fdb827 16.6% 33.3%,
          #f5821f 33.3% 50%,
          #e03a3e 50% 66.6%,
          #963d97 66.6% 83.3%,
          #009ddc 83.3% 100%
        );
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
      }

      .home-link-wrapper {
        margin-top: 40px;
        text-align: center;
      }

      .home-link {
        display: inline-block;
        color: var(--text-color);
        font-size: 0.9rem;
        font-weight: 500;
        letter-spacing: 0.01em;
        text-decoration: none;
        padding: 13px 28px;
        border-radius: 999px;
        background: var(--glass-bg);
        -webkit-backdrop-filter: blur(14px) saturate(160%);
        backdrop-filter: blur(14px) saturate(160%);
        border: 1px solid var(--glass-stroke);
        box-shadow: var(--glass-inner);
        transition:
          transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
          background 0.3s ease,
          color 0.3s ease;
      }

      .home-link:hover {
        transform: scale(1.05);
        background: var(--glass-bg-strong);
        color: var(--text-color);
      }
      .home-link:active {
        transform: scale(0.96);
      }

      footer {
        position: relative;
        z-index: 1;
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: calc(100% - 48px);
        margin: 0 24px 24px;
        padding: 16px 28px;
        border-radius: 999px;
        color: var(--footer-color);
        font-size: 0.78rem;
        letter-spacing: 0.01em;
      }

      @media (max-width: 768px) {
        .top-nav {
          padding: 20px;
        }
        footer {
          width: calc(100% - 24px);
          margin: 0 12px 12px;
          padding: 12px 18px;
          font-size: 0.62rem;
        }
        .glass-card {
          border-radius: 28px;
          padding: 40px 28px;
          margin: 0 16px;
        }
        .name {
          font-size: 14vw;
        }
        .tagline {
          font-size: 0.7rem;
        }
        .home-link-wrapper {
          margin-top: 26px;
        }
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  </head>
  <body>
    <div class="ambient"><div class="blob"></div></div>

    <div class="top-nav">
      <button id="theme-toggle" aria-label="Toggle Theme">
        <svg id="sun-icon" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg id="moon-icon" viewBox="0 0 24 24">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </div>

    <div class="content-wrapper">
      <div class="glass glass-card">
        <div class="name" id="name"
          ><span id="name-text"></span><span class="caret" id="caret"></span
        ></div>
        <div class="tagline reveal">building things on the internet</div>
        <div class="home-link-wrapper reveal">
          <a href="mailto:x@nabeel.ca" class="home-link">x@nabeel.ca</a>
        </div>
      </div>
    </div>

    <footer class="glass">
      <div class="footer-left">
        © <span id="year"></span> Nabeel. All rights reserved
      </div>
      <div class="footer-right">
        San Francisco, CA. <span id="clock">00:00:00 AM</span>
      </div>
    </footer>

    <script>
      const themeToggle = document.getElementById("theme-toggle");
      const body = document.body;
      // light is the default; dark only when explicitly chosen
      if (localStorage.getItem("theme") !== "dark")
        body.setAttribute("data-theme", "light");

      themeToggle.addEventListener("click", () => {
        if (body.getAttribute("data-theme") === "light") {
          body.removeAttribute("data-theme");
          localStorage.setItem("theme", "dark");
        } else {
          body.setAttribute("data-theme", "light");
          localStorage.setItem("theme", "light");
        }
      });

      const nameEl = document.getElementById("name");
      const nameText = document.getElementById("name-text");
      const caret = document.getElementById("caret");

      // LoveFrom-style typewriter intro
      const NAME = "Nabeel";
      let typeIndex = 0;
      function typeNext() {
        if (typeIndex < NAME.length) {
          nameText.textContent = NAME.slice(0, ++typeIndex);
          setTimeout(typeNext, 140 + Math.random() * 90);
        } else {
          nameText.innerHTML = 'N<span class="apple-a">a</span>beel';
          caret.classList.add("done");
          document
            .querySelectorAll(".reveal")
            .forEach((el, i) =>
              setTimeout(() => el.classList.add("shown"), 250 + i * 200),
            );
        }
      }
      setTimeout(typeNext, 600);

      const greetings = [
        "Nabeel",
        "hello",
        "salaam",
        "bonjour",
        "hola",
        "ciao",
        "こんにちは",
      ];
      let greetIndex = 0;
      let nameClicks = 0;

      const triggerHello = () => {
        confetti({
          particleCount: 60,
          spread: 60,
          origin: { y: 0.6 },
          disableForReducedMotion: true,
        });
      };

      nameEl.addEventListener("click", () => {
        nameClicks++;
        nameEl.classList.add("fading");
        setTimeout(() => {
          greetIndex = (greetIndex + 1) % greetings.length;
          if (greetings[greetIndex] === "Nabeel") {
            nameText.innerHTML = 'N<span class="apple-a">a</span>beel';
          } else {
            nameText.textContent = greetings[greetIndex];
          }
          nameEl.classList.remove("fading");
        }, 300);
        if (nameClicks === 5) {
          triggerHello();
          console.log(
            "%c;)",
            "color: #a3a3a3; font-family: monospace; font-size: 12px;",
          );
          nameClicks = 0;
        }
      });

      let inputBuffer = "";
      const secrets = {
        dark: () => {
          body.removeAttribute("data-theme");
          localStorage.setItem("theme", "dark");
        },
        light: () => {
          body.setAttribute("data-theme", "light");
          localStorage.setItem("theme", "light");
        },
        nabeel: () => {
          triggerHello();
        },
        apple: () => {
          nameEl.classList.toggle("retro");
        },
      };

      window.addEventListener("keydown", (e) => {
        if (e.key.length === 1) {
          inputBuffer += e.key.toLowerCase();
          if (inputBuffer.length > 10) inputBuffer = inputBuffer.substring(1);
          for (const word in secrets) {
            if (inputBuffer.includes(word)) {
              secrets[word]();
              inputBuffer = "";
            }
          }
        }
      });

      document.getElementById("year").textContent = new Date().getFullYear();
      let clockZone = "America/Los_Angeles";
      const footerRight = document.querySelector(".footer-right");
      footerRight.style.cursor = "pointer";
      footerRight.addEventListener("click", () => {
        clockZone = clockZone === "UTC" ? "America/Los_Angeles" : "UTC";
        footerRight.firstChild.textContent =
          clockZone === "UTC" ? "UTC. " : "San Francisco, CA. ";
        updateClock();
      });
      function updateClock() {
        const options = {
          timeZone: clockZone,
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hour12: true,
        };
        const formatter = new Intl.DateTimeFormat([], options);
        document.getElementById("clock").textContent = formatter.format(
          new Date(),
        );
      }
      setInterval(updateClock, 1000);
      updateClock();

      // dynamic specular highlight: mouse on desktop, gyroscope on mobile
      const root = document.documentElement;
      let rafPending = false;
      let specX = 30,
        specY = 20;
      function applySpec() {
        rafPending = false;
        root.style.setProperty("--spec-x", specX + "%");
        root.style.setProperty("--spec-y", specY + "%");
      }
      function setSpec(x, y) {
        specX = Math.max(0, Math.min(100, x));
        specY = Math.max(0, Math.min(100, y));
        if (!rafPending) {
          rafPending = true;
          requestAnimationFrame(applySpec);
        }
      }

      window.addEventListener("pointermove", (e) => {
        setSpec(
          (e.clientX / window.innerWidth) * 100,
          (e.clientY / window.innerHeight) * 100,
        );
      });

      // per-element rim glint: lerped toward the cursor for a fluid glide
      document
        .querySelectorAll(".glass, #theme-toggle, .home-link")
        .forEach((el) => {
          let tx = 0,
            ty = 0,
            cx = null,
            cy = null,
            animating = false;
          const step = () => {
            cx += (tx - cx) * 0.12;
            cy += (ty - cy) * 0.12;
            el.style.setProperty("--mx", cx + "px");
            el.style.setProperty("--my", cy + "px");
            if (Math.abs(tx - cx) + Math.abs(ty - cy) > 0.3) {
              requestAnimationFrame(step);
            } else {
              animating = false;
            }
          };
          el.addEventListener("pointermove", (e) => {
            const r = el.getBoundingClientRect();
            tx = e.clientX - r.left;
            ty = e.clientY - r.top;
            if (cx === null) {
              cx = tx;
              cy = ty;
            }
            if (!animating) {
              animating = true;
              requestAnimationFrame(step);
            }
          });
        });

      const glintEls = document.querySelectorAll(
        ".glass, #theme-toggle, .home-link",
      );
      function handleOrientation(e) {
        if (e.gamma === null && e.beta === null) return;
        document.body.classList.add("tilt-active");
        // gamma: left/right tilt (-90..90), beta: front/back tilt (-180..180)
        const nx = Math.max(-1, Math.min(1, e.gamma / 35));
        const ny = Math.max(-1, Math.min(1, (e.beta - 40) / 35));
        setSpec(50 + nx * 50, 50 + ny * 50);
        // sweep each element's rim glint with the tilt
        glintEls.forEach((el) => {
          el.style.setProperty("--mx", ((nx + 1) / 2) * el.offsetWidth + "px");
          el.style.setProperty("--my", ((ny + 1) / 2) * el.offsetHeight + "px");
        });
      }

      // iOS: motion access needs HTTPS + a user gesture. Keep asking on every
      // tap until it's granted (or the user denies it in the popup).
      const needsMotionPermission =
        typeof DeviceOrientationEvent !== "undefined" &&
        typeof DeviceOrientationEvent.requestPermission === "function";

      function startTilt() {
        window.addEventListener("deviceorientation", handleOrientation);
      }

      if (needsMotionPermission) {
        let motionSettled = false;
        const askMotion = () => {
          if (motionSettled) return;
          DeviceOrientationEvent.requestPermission()
            .then((state) => {
              if (state === "granted" || state === "denied") {
                motionSettled = true;
                window.removeEventListener("touchend", askMotion);
                window.removeEventListener("click", askMotion);
              }
              if (state === "granted") startTilt();
            })
            .catch(() => {
              /* not a valid gesture yet — try again on the next tap */
            });
        };
        window.addEventListener("touchend", askMotion);
        window.addEventListener("click", askMotion);
      } else if (typeof DeviceOrientationEvent !== "undefined") {
        startTilt();
      }

      console.log(
        "%cNABEEL",
        "color: #ffffff; font-family: monospace; font-size: 24px; font-weight: bold; padding: 10px 0;",
      );
      console.log(
        "%cYou found the console. Try typing 'apple' on the page ;)",
        "color: #a3a3a3; font-family: monospace; font-size: 12px;",
      );
    </script>
  </body>
</html>
