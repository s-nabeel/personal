<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Nabeel</title>

    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="favicon.png" />

    <meta name="title" content="Nabeel" />
    <meta name="description" content="Personal site of Nabeel." />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nabeel.ca/" />
    <meta property="og:title" content="Nabeel" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://nabeel.ca/" />
    <meta name="twitter:title" content="Nabeel" />
    <meta name="twitter:description" content="Personal site of Nabeel." />
    <meta name="twitter:image" content="https://nabeel.ca/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=EB+Garamond:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-color: #08080b;
        --text-color: #f5f5f7;
        --muted-color: #9a9aa2;
        --footer-color: #86868b;

        /* liquid glass tokens */
        --glass-bg: rgba(255, 255, 255, 0.06);
        --glass-bg-strong: rgba(255, 255, 255, 0.1);
        --glass-stroke: rgba(255, 255, 255, 0.25);
        --glass-inner: inset 0 1px 1px rgba(255, 255, 255, 0.3),
          inset 0 -1px 1px rgba(255, 255, 255, 0.08);
        --card-shadow: 0 40px 90px rgba(0, 0, 0, 0.55),
          0 8px 24px rgba(0, 0, 0, 0.35);
        --emboss-hi: rgba(255, 255, 255, 0.35);
        --emboss-lo: rgba(0, 0, 0, 0.5);

        --blob-a: rgba(255, 20, 120, 0.5);
        --blob-b: rgba(255, 100, 20, 0.32);
        --blob-c: rgba(130, 60, 255, 0.42);
        --blob-d: rgba(0, 170, 255, 0.22);

        --glint-core: rgba(255, 255, 255, 0.95);
        --glint-mid: rgba(255, 255, 255, 0.3);
      }

      [data-theme="light"] {
        --bg-color: #f0f0f4;
        --text-color: #101014;
        --muted-color: #55555c;
        --footer-color: #6b6b72;

        --glass-bg: rgba(255, 255, 255, 0.34);
        --glass-bg-strong: rgba(255, 255, 255, 0.5);
        --glass-stroke: rgba(255, 255, 255, 0.75);
        --glass-inner: inset 0 1px 1px rgba(255, 255, 255, 0.95),
          inset 0 -1px 1px rgba(255, 255, 255, 0.4);
        --card-shadow: 0 40px 90px rgba(60, 50, 100, 0.28),
          0 8px 24px rgba(60, 50, 100, 0.12);
        --emboss-hi: rgba(255, 255, 255, 0.9);
        --emboss-lo: rgba(0, 0, 0, 0.18);

        --blob-a: rgba(255, 90, 160, 0.45);
        --blob-b: rgba(255, 160, 80, 0.35);
        --blob-c: rgba(150, 110, 255, 0.4);
        --blob-d: rgba(60, 190, 255, 0.3);

        --glint-core: rgba(60, 80, 215, 1);
        --glint-mid: rgba(60, 80, 215, 0.4);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        user-select: none;
        -webkit-user-select: none;
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter",
          "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-style: normal !important;
        -webkit-font-smoothing: antialiased;
      }

      html,
      body {
        height: 100%;
        width: 100%;
        overflow: hidden;
        position: fixed;
      }

      body {
        background-color: var(--bg-color);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: var(--text-color);
        transition:
          background-color 0.4s ease,
          color 0.4s ease;
      }

      /* vivid ambient field the glass refracts */
      .ambient {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        overflow: hidden;
        filter: saturate(1.2);
      }
      .ambient i {
        position: absolute;
        border-radius: 50%;
        filter: blur(70px);
        will-change: transform;
      }
      /* static so liquidGL's snapshot refraction stays in sync */
      .ambient .b1 {
        width: 55vmax;
        height: 55vmax;
        background: var(--blob-a);
        top: -14vmax;
        left: -8vmax;
      }
      .ambient .b2 {
        width: 45vmax;
        height: 45vmax;
        background: var(--blob-b);
        bottom: -14vmax;
        right: -8vmax;
      }
      .ambient .b3 {
        width: 40vmax;
        height: 40vmax;
        background: var(--blob-c);
        top: 26%;
        left: 52%;
      }
      .ambient .b4 {
        width: 30vmax;
        height: 30vmax;
        background: var(--blob-d);
        top: 52%;
        left: 6%;
      }

      /* shared liquid glass recipe */
      .glass {
        position: relative;
        background: var(--glass-bg);
        -webkit-backdrop-filter: blur(26px) saturate(190%);
        backdrop-filter: blur(26px) saturate(190%);
        border: 1px solid var(--glass-stroke);
        box-shadow: var(--glass-inner);
        transition:
          background 0.4s ease,
          border-color 0.4s ease;
      }

      /* rim glint that follows the cursor */
      .glass::after {
        content: "";
        position: absolute;
        inset: -1px;
        border-radius: inherit;
        pointer-events: none;
        padding: 1.5px;
        background: radial-gradient(
          180px circle at var(--mx, 50%) var(--my, 50%),
          var(--glint-core) 0%,
          var(--glint-mid) 40%,
          transparent 70%
        );
        -webkit-mask:
          linear-gradient(#000 0 0) content-box,
          linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
        mask:
          linear-gradient(#000 0 0) content-box,
          linear-gradient(#000 0 0);
        mask-composite: exclude;
        opacity: 0;
        transition: opacity 0.5s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .glass:hover::after {
        opacity: 1;
      }

      .top-nav {
        position: fixed;
        top: 0;
        right: 0;
        padding: 32px 40px;
        z-index: 100;
      }

      #theme-toggle {
        z-index: 5;
        border-radius: 999px;
        color: var(--text-color);
        cursor: pointer;
        width: 44px;
        height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
        outline: none;
        -webkit-tap-highlight-color: transparent;
        transition:
          transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
          background 0.4s ease;
      }
      #theme-toggle:hover {
        transform: scale(1.08);
        background: var(--glass-bg-strong);
      }
      #theme-toggle:active {
        transform: scale(0.94);
      }

      #theme-toggle svg {
        position: absolute;
        width: 16px;
        height: 16px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        transition:
          transform 0.6s cubic-bezier(0.4, 0, 0.2, 1),
          opacity 0.4s ease;
      }

      #sun-icon {
        opacity: 1;
        transform: rotate(0deg);
      }
      #moon-icon {
        opacity: 0;
        transform: rotate(-90deg);
      }

      [data-theme="light"] #sun-icon {
        opacity: 0;
        transform: rotate(90deg);
      }
      [data-theme="light"] #moon-icon {
        opacity: 1;
        transform: rotate(0deg);
      }

      .content-wrapper {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        width: 100%;
        z-index: 1;
        perspective: 1400px;
      }

      /* ————— the platinum card ————— */
      .card {
        width: min(360px, calc(100vw - 48px));
        height: 220px;
        border-radius: 1rem;
        position: relative;
        overflow: clip;
        will-change: transform;
        z-index: 5;
      }
      /* content renders above the WebGL canvas */
      .card > * {
        position: absolute;
        z-index: 3;
      }
      .card a {
        pointer-events: auto;
      }

      /* brushed platinum face — translucent so the liquid glass shows through */
      .metal {
        inset: 0;
        z-index: 2;
        border-radius: inherit;
        background:
          repeating-linear-gradient(
            92deg,
            rgba(255, 255, 255, 0) 0 1px,
            rgba(120, 120, 130, 0.05) 1px 2px
          ),
          radial-gradient(
            120% 160% at 28% 0%,
            rgba(255, 255, 255, 0.65) 0%,
            rgba(226, 226, 232, 0.55) 34%,
            rgba(196, 196, 205, 0.55) 60%,
            rgba(230, 230, 236, 0.6) 100%
          ),
          linear-gradient(105deg, #dcdce2 0%, #f2f2f5 45%, #c8c8d0 100%);
        opacity: 0.82;
        pointer-events: none;
      }
      /* faint guilloché-style engraving over the metal */
      .metal::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background:
          repeating-radial-gradient(
            circle at 30% 20%,
            rgba(90, 90, 100, 0.05) 0 1px,
            transparent 1px 9px
          ),
          repeating-radial-gradient(
            circle at 75% 85%,
            rgba(90, 90, 100, 0.05) 0 1px,
            transparent 1px 11px
          );
      }

      /* ornate lace border, like an engraved chain frame */
      .lace {
        inset: 3px;
        z-index: 3;
        border-radius: calc(1rem - 3px);
        border: 7px solid transparent;
        border-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14"><path d="M7 2L12 7L7 12L2 7Z" fill="none" stroke="%23515158" stroke-width="1.2"/><circle cx="7" cy="7" r="1" fill="%23515158"/></svg>')
          14 round;
        opacity: 0.7;
        pointer-events: none;
      }

      /* double hairline engraved frame */
      .frame {
        inset: 11px;
        z-index: 3;
        border-radius: calc(1rem - 10px);
        border: 1px solid rgba(70, 70, 78, 0.3);
        pointer-events: none;
      }

      .engraved {
        color: #4b4b52;
        text-shadow: 0 1px 0 rgba(255, 255, 255, 0.65);
      }

      /* top wordmark */
      .card-word {
        top: 18px;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 1.45rem;
        font-weight: 800;
        letter-spacing: 0.3em;
        text-indent: 0.3em;
        text-transform: uppercase;
        color: #2d2d33;
      }

      /* ghost brand lettering in the metal, like the reference */
      .ghost {
        inset: 0;
        z-index: 2;
        border-radius: inherit;
        background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="240" height="150"><g fill="rgba(80,80,92,0.08)" font-family="Helvetica,Arial" font-weight="700" letter-spacing="6"><text x="6" y="42" font-size="15" transform="rotate(-4 6 42)">NABEEL</text><text x="120" y="108" font-size="13" transform="rotate(3 120 108)">NABEEL</text><text x="30" y="140" font-size="11">NABEEL</text></g></svg>');
        pointer-events: none;
      }

      .card-chip {
        top: 52px;
        left: 26px;
        width: 40px;
        height: auto;
        opacity: 0.85;
        filter: brightness(0.75) contrast(1.1);
      }

      /* engraved leaf emblem */
      .emblem {
        top: 47%;
        left: 42%;
        transform: translate(-50%, -50%);
        width: 66px;
        height: 82px;
        pointer-events: none;
      }
      .emblem svg {
        width: 100%;
        height: 100%;
      }

      /* contactless + number */
      .tap-row {
        top: 84px;
        right: 26px;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.95rem;
        font-weight: 600;
        letter-spacing: 0.12em;
      }
      .tap-row svg {
        width: 16px;
        height: 16px;
        opacity: 0.75;
      }

      /* curved member-since scroll ribbon */
      .member {
        top: 138px;
        right: 20px;
        width: 118px;
        height: 40px;
        pointer-events: none;
      }
      .member svg {
        width: 100%;
        height: 100%;
        overflow: visible;
      }

      .holder {
        bottom: 16px;
        left: 26px;
        font-size: 1.15rem;
        font-weight: 400;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        text-decoration: none;
        color: #55555c;
      }

      .card-copyright {
        bottom: 18px;
        right: 26px;
        font-size: 0.52rem;
        font-weight: 600;
        letter-spacing: 0.1em;
        opacity: 0.7;
      }

      .card-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
      }

      .name {
        transition: opacity 0.3s ease;
      }
      .name.fading {
        opacity: 0;
      }
      .name span {
        font-family: inherit;
      }

      .name .caret {
        display: inline-block;
        width: 1.5px;
        height: 0.85em;
        background: #4b4b52;
        margin-left: 5px;
        vertical-align: -0.06em;
        animation: blink 1.1s step-end infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0;
        }
      }
      .name .caret.done {
        animation: caret-out 0.6s ease forwards 1.2s;
      }
      @keyframes caret-out {
        to {
          opacity: 0;
        }
      }

      .reveal {
        opacity: 0;
        transform: translateY(8px);
        transition:
          opacity 0.9s ease,
          transform 0.9s ease;
      }
      .reveal.shown {
        opacity: 1;
        transform: translateY(0);
      }

      /* retro six-color Apple stripes — secret */
      .name.retro #name-text {
        background: linear-gradient(
          180deg,
          #61bb46 0% 16.6%,
          #fdb827 16.6% 33.3%,
          #f5821f 33.3% 50%,
          #e03a3e 50% 66.6%,
          #963d97 66.6% 83.3%,
          #009ddc 83.3% 100%
        );
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
        text-shadow: none;
      }

      footer {
        position: relative;
        z-index: 5;
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: calc(100% - 48px);
        margin: 0 24px 24px;
        padding: 15px 26px;
        border-radius: 999px;
        color: var(--footer-color);
        font-size: 0.76rem;
        letter-spacing: 0.01em;
      }

      @media (max-width: 768px) {
        .top-nav {
          padding: 18px 20px;
        }
        footer {
          width: calc(100% - 24px);
          margin: 0 12px 12px;
          padding: 11px 18px;
          font-size: 0.6rem;
        }
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="scripts/liquidGL.js" defer></script>
  </head>
  <body>
    <div class="ambient">
      <i class="b1"></i><i class="b2"></i><i class="b3"></i><i class="b4"></i>
    </div>

    <div class="top-nav">
      <button id="theme-toggle" class="glass" aria-label="Toggle Theme">
        <svg id="sun-icon" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg id="moon-icon" viewBox="0 0 24 24">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </div>

    <div class="content-wrapper">
      <div class="card liquidGL" id="card">
        <div class="metal"></div>
        <div class="ghost"></div>
        <div class="lace"></div>
        <div class="frame"></div>
        <div class="card-word engraved name" id="name"
          ><span id="name-text"></span><span class="caret" id="caret"></span
        ></div>
        <img src="assets/card-chip.svg" alt="Chip" class="card-chip" />
        <div class="emblem reveal">
          <svg viewBox="0 0 100 124" fill="none" xmlns="http://www.w3.org/2000/svg">
            <ellipse
              cx="50"
              cy="62"
              rx="36"
              ry="50"
              stroke="#4b4b52"
              stroke-width="1.6"
            />
            <ellipse
              cx="50"
              cy="62"
              rx="31"
              ry="45"
              stroke="#4b4b52"
              stroke-width="0.7"
              opacity="0.6"
            />
            <text
              x="50"
              y="80"
              text-anchor="middle"
              font-family="Georgia, serif"
              font-size="52"
              font-weight="600"
              fill="#4b4b52"
            >
              N
            </text>
          </svg>
        </div>
        <div class="tap-row engraved reveal">
          <svg viewBox="0 0 24 24" fill="none" stroke="#4b4b52" stroke-width="2" stroke-linecap="round">
            <path d="M6 8.8a6.5 6.5 0 0 1 0 6.4" />
            <path d="M10 6.6a10 10 0 0 1 0 10.8" />
            <path d="M14 4.4a13.5 13.5 0 0 1 0 15.2" />
          </svg>
          <span>2026</span>
        </div>
        <div class="member reveal">
          <svg viewBox="0 0 158 52" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <path id="member-arc" d="M14 32 Q79 10 144 32" />
            </defs>
            <path
              d="M6 36 Q79 8 152 36 L152 44 Q79 16 6 44 Z"
              fill="rgba(240,240,244,0.85)"
              stroke="#4b4b52"
              stroke-width="1"
            />
            <text
              font-size="9.5"
              font-weight="600"
              letter-spacing="2"
              fill="#4b4b52"
            >
              <textPath href="#member-arc" startOffset="50%" text-anchor="middle">
                MEMBER SINCE
              </textPath>
            </text>
            <text
              x="79"
              y="52"
              text-anchor="middle"
              font-size="12"
              font-weight="600"
              letter-spacing="1"
              fill="#4b4b52"
            >
              26
            </text>
          </svg>
        </div>
        <div class="holder engraved reveal">N Syed</div>
        <div class="card-copyright engraved reveal">© Nabeel</div>
      </div>
    </div>

    <footer class="glass liquidGL-flat">
      <div class="footer-left">
        © <span id="year"></span> Nabeel ·
        <a href="mailto:x@nabeel.ca" style="color: inherit">x@nabeel.ca</a>
      </div>
      <div class="footer-right" id="clock-wrap">
        San Francisco, CA. <span id="clock">00:00:00</span>
      </div>
    </footer>

    <script>
      const themeToggle = document.getElementById("theme-toggle");
      const body = document.body;
      // light is the default; dark only when explicitly chosen
      if (localStorage.getItem("theme") !== "dark")
        body.setAttribute("data-theme", "light");

      themeToggle.addEventListener("click", () => {
        if (body.getAttribute("data-theme") === "light") {
          body.removeAttribute("data-theme");
          localStorage.setItem("theme", "dark");
        } else {
          body.setAttribute("data-theme", "light");
          localStorage.setItem("theme", "light");
        }
      });

      const nameEl = document.getElementById("name");
      const nameText = document.getElementById("name-text");
      const caret = document.getElementById("caret");
      const NAME_HTML = "Nabeel";

      // LoveFrom-style typewriter intro
      const NAME = "Nabeel";
      let typeIndex = 0;
      function typeNext() {
        if (typeIndex < NAME.length) {
          nameText.textContent = NAME.slice(0, ++typeIndex);
          setTimeout(typeNext, 140 + Math.random() * 90);
        } else {
          nameText.innerHTML = NAME_HTML;
          caret.classList.add("done");
          document
            .querySelectorAll(".reveal")
            .forEach((el, i) =>
              setTimeout(() => el.classList.add("shown"), 250 + i * 180),
            );
        }
      }
      setTimeout(typeNext, 600);

      const greetings = [
        "Nabeel",
        "hello",
        "salaam",
        "bonjour",
        "hola",
        "ciao",
        "こんにちは",
      ];
      let greetIndex = 0;
      let nameClicks = 0;

      const triggerHello = () => {
        confetti({
          particleCount: 60,
          spread: 60,
          origin: { y: 0.6 },
          disableForReducedMotion: true,
        });
      };

      // name-click greeting easter egg — disabled for now
      // nameEl.addEventListener("click", () => {
      //   nameClicks++;
      //   nameEl.classList.add("fading");
      //   setTimeout(() => {
      //     greetIndex = (greetIndex + 1) % greetings.length;
      //     if (greetings[greetIndex] === "Nabeel") {
      //       nameText.innerHTML = NAME_HTML;
      //     } else {
      //       nameText.textContent = greetings[greetIndex];
      //     }
      //     nameEl.classList.remove("fading");
      //   }, 300);
      //   if (nameClicks === 5) {
      //     triggerHello();
      //     nameClicks = 0;
      //   }
      // });

      let inputBuffer = "";
      const secrets = {
        dark: () => {
          body.removeAttribute("data-theme");
          localStorage.setItem("theme", "dark");
        },
        light: () => {
          body.setAttribute("data-theme", "light");
          localStorage.setItem("theme", "light");
        },
        nabeel: () => {
          triggerHello();
        },
        apple: () => {
          nameEl.classList.toggle("retro");
        },
      };

      window.addEventListener("keydown", (e) => {
        if (e.key.length === 1) {
          inputBuffer += e.key.toLowerCase();
          if (inputBuffer.length > 10) inputBuffer = inputBuffer.substring(1);
          for (const word in secrets) {
            if (inputBuffer.includes(word)) {
              secrets[word]();
              inputBuffer = "";
            }
          }
        }
      });

      document.getElementById("year").textContent = new Date().getFullYear();
      let clockZone = "America/Los_Angeles";
      const clockWrap = document.getElementById("clock-wrap");
      clockWrap.style.cursor = "pointer";
      clockWrap.addEventListener("click", () => {
        clockZone = clockZone === "UTC" ? "America/Los_Angeles" : "UTC";
        clockWrap.firstChild.textContent =
          clockZone === "UTC" ? "\n        UTC. " : "\n        San Francisco, CA. ";
        updateClock();
      });
      function updateClock() {
        const formatter = new Intl.DateTimeFormat([], {
          timeZone: clockZone,
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hour12: false,
        });
        document.getElementById("clock").textContent = formatter.format(
          new Date(),
        );
      }
      setInterval(updateClock, 1000);
      updateClock();

      // ————— true liquid glass: liquidGL WebGL refraction (MIT, NaughtyDuk) —————
      // Cursor tilt only — no device sensors, no permission prompts, ever.
      document.addEventListener("DOMContentLoaded", () => {
        if (typeof liquidGL === "function") {
          // bank card: tilts with the cursor
          liquidGL({
            snapshot: "body",
            target: ".liquidGL",
            refraction: 0,
            bevelDepth: 0.1,
            bevelWidth: 0.17,
            frost: 2,
            shadow: true,
            specular: true,
            reveal: "fade",
            tilt: true,
            tiltFactor: 25,
          });
          // footer bar: same glass, no tilt
          liquidGL({
            snapshot: "body",
            target: ".liquidGL-flat",
            refraction: 0,
            bevelDepth: 0.1,
            bevelWidth: 0.17,
            frost: 2,
            shadow: true,
            specular: true,
            reveal: "fade",
            tilt: false,
          });
        }
      });

      // rim glint tracking on small glass elements
      document.querySelectorAll(".glass").forEach((el) => {
        el.addEventListener("pointermove", (e) => {
          const r = el.getBoundingClientRect();
          el.style.setProperty("--mx", e.clientX - r.left + "px");
          el.style.setProperty("--my", e.clientY - r.top + "px");
        });
      });

      console.log(
        "%cNABEEL",
        "color: #ffffff; font-family: monospace; font-size: 24px; font-weight: bold; padding: 10px 0;",
      );
      console.log(
        "%cYou found the console. Try typing 'apple' on the page ;)",
        "color: #a3a3a3; font-family: monospace; font-size: 12px;",
      );
    </script>
  </body>
</html>
