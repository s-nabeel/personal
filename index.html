    <style>
      :root {
        color-scheme: dark;
        --bg-color: #000000;
        --text-color: #f5f5f7;
        --muted-color: #86868b;
        --accent: #2997ff;
        --sheen-hi: rgba(255, 255, 255, 0.16);
        --sheen-mid: rgba(255, 255, 255, 0.05);
        --sheen-rim: rgba(255, 255, 255, 0.28);
        --pill-bg: rgba(255, 255, 255, 0.08);
        --glass-ring: rgba(255, 255, 255, 0.14);
        --glass-depth: rgba(0, 0, 0, 0.35);
        --glass-shadow: rgba(0, 0, 0, 0.35);
        --glow: 0.55;
        --pad: clamp(56px, 10vw, 140px);
        --radius: clamp(16px, 2vw, 28px);
        --pane-h: calc(100vh - 2 * var(--pad));
        --display-font: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
        --text-font: "SF Pro Text", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
      }
      [data-theme="light"] {
        color-scheme: light;
        --bg-color: #f5f5f7;
        --text-color: #1d1d1f;
        --muted-color: #6e6e73;
        --accent: #0071e3;
        --sheen-hi: rgba(255, 255, 255, 0.42);
        --sheen-mid: rgba(255, 255, 255, 0.12);
        --sheen-rim: rgba(255, 255, 255, 0.75);
        --pill-bg: rgba(255, 255, 255, 0.55);
        --glass-ring: rgba(0, 0, 0, 0.06);
        --glass-depth: rgba(0, 0, 0, 0.06);
        --glass-shadow: rgba(0, 0, 0, 0.12);
        --glow: 0.32;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        user-select: none;
        -webkit-user-select: none;
        font-family: var(--text-font);
        -webkit-font-smoothing: antialiased;
      }

      html {
        background-color: var(--bg-color);
        touch-action: pan-y;
        -webkit-text-size-adjust: 100%;
      }
      body {
        background-color: var(--bg-color);
        color: var(--text-color);
        overscroll-behavior-y: none;
        opacity: 0;
        transition: opacity 0.6s ease;
      }
      body.ready {
        opacity: 1;
      }

      ::view-transition-old(root),
      ::view-transition-new(root) {
        animation-duration: 0.45s;
        animation-timing-function: ease-in-out;
      }
      .vt-fast::view-transition-old(root),
      .vt-fast::view-transition-new(root) {
        animation-duration: 0.2s;
      }

      .main-content {
        position: relative;
        background: var(--bg-color);
        overflow-x: clip;
      }
      .banner-text-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        max-width: 60%;
        margin: 0 auto;
        padding-top: 86svh;
        padding-bottom: calc(100svh - var(--pad) + 1vh);
      }
      .glows {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }
      .glow {
        position: absolute;
        width: 56vmin;
        height: 56vmin;
        opacity: var(--glow);
        pointer-events: none;
      }
      .toolbar-cover {
        position: sticky;
        top: 0;
        height: 100lvh;
        margin-bottom: -100lvh;
        z-index: 5;
        pointer-events: none;
      }
      .toolbar-cover::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: -160px;
        height: calc(100lvh - 100svh + env(safe-area-inset-bottom, 0px) + 200px);
        background: var(--bg-color);
      }
      .banner-text {
        width: 100%;
        text-align: center;
        margin: 0 auto calc(var(--pane-h) + 2vh);
        font-family: var(--display-font);
        font-size: clamp(56px, 7vw, 132px);
        font-weight: 600;
        letter-spacing: -0.015em;
        line-height: 1;
        color: var(--text-color);
        pointer-events: none;
      }
      .banner-text.small {
        font-size: clamp(20px, 2.2vw, 40px);
        font-weight: 400;
        letter-spacing: 0.011em;
        line-height: 1.2;
        color: var(--muted-color);
      }
      .banner-text {
        position: relative;
      }
      .banner-text span {
        font-family: inherit;
      }
      #name {
        padding: 0.4em 0 0.8em;
        margin: 0 auto calc(var(--pane-h) + 2vh - 0.8em);
      }
      .banner-text .word {
        position: relative;
        z-index: 1;
      }
      .banner-text.retro .word,
      .runner {
        font-family: "EB Garamond", Georgia, "Times New Roman", serif;
        font-weight: 400;
        letter-spacing: -0.03em;
        color: var(--text-color);
      }
      .banner-text .think {
        display: none;
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0.12em;
        text-align: center;
        font-family: "EB Garamond", Georgia, "Times New Roman", serif;
        font-weight: 400;
        font-size: 0.24em;
        letter-spacing: 0;
        color: var(--muted-color);
      }
      .banner-text.crashed .think,
      .banner-text.thinking .think {
        display: block;
      }
      .banner-text .i {
        display: none;
      }
      .banner-text.crashed .i {
        display: inline;
      }
      .banner-text.leaving .i {
        visibility: hidden;
      }
      .banner-text.hold .i {
        display: inline;
        visibility: hidden;
      }
      .runner {
        display: none;
        position: absolute;
        top: 0;
        left: -60vw;
        line-height: 1;
        white-space: nowrap;
        pointer-events: none;
      }
      .runner.running {
        display: block;
      }
      .shape {
        position: fixed;
        top: var(--pad);
        left: calc(var(--pad) + env(safe-area-inset-left));
        width: calc(100vw - 2 * var(--pad) - env(safe-area-inset-left) - env(safe-area-inset-right));
        height: var(--pane-h);
        border-radius: var(--radius);
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(20px) saturate(180%);
        will-change: transform;
        pointer-events: auto;
        z-index: 9999;
      }

      .mask {
        position: fixed;
        top: var(--pad);
        left: calc(var(--pad) + env(safe-area-inset-left));
        width: calc(100vw - 2 * var(--pad) - env(safe-area-inset-left) - env(safe-area-inset-right));
        height: var(--pane-h);
        border-radius: var(--radius);
        box-shadow: 0 0 0 200vmax var(--bg-color);
        pointer-events: none;
        z-index: 9990;
      }

      .lens {
        position: relative;
        overflow: clip;
        will-change: transform;
      }
      .lens::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        z-index: 2;
        pointer-events: none;
        background: linear-gradient(
          125deg,
          var(--sheen-hi) 0%,
          var(--sheen-mid) 34%,
          rgba(255, 255, 255, 0) 62%
        );
        box-shadow: inset 0 1px 1px var(--sheen-rim);
      }
      .lens > * {
        position: relative;
        z-index: 3;
      }

      .top-nav {
        position: fixed;
        top: 0;
        right: 0;
        padding: calc(32px + env(safe-area-inset-top)) calc(40px + env(safe-area-inset-right)) 32px 40px;
        z-index: 10000;
      }
      #theme-toggle {
        width: 53px;
        height: 53px;
        border: none;
        background: var(--pill-bg);
        -webkit-backdrop-filter: blur(18px) saturate(180%);
        backdrop-filter: blur(18px) saturate(180%);
        box-shadow:
          0 12px 32px var(--glass-shadow),
          0 0 0 0.5px var(--glass-ring),
          inset 0 -1px 1px var(--glass-depth);
        border-radius: 999px;
        color: var(--text-color);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        outline: none;
        -webkit-tap-highlight-color: transparent;
        transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      #theme-toggle:hover {
        transform: scale(1.04);
      }
      #theme-toggle:active {
        transform: scale(0.97);
      }
      #theme-toggle svg {
        position: absolute;
        z-index: 3;
        width: 17px;
        height: 17px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
        transition:
          transform 0.6s cubic-bezier(0.4, 0, 0.2, 1),
          opacity 0.4s ease;
      }
      #sun-icon {
        opacity: 1;
        transform: rotate(0deg);
      }
      #moon-icon {
        opacity: 0;
        transform: rotate(-90deg);
      }
      [data-theme="light"] #sun-icon {
        opacity: 0;
        transform: rotate(90deg);
      }
      [data-theme="light"] #moon-icon {
        opacity: 1;
        transform: rotate(0deg);
      }

      .scroll-hint {
        position: absolute;
        left: 0;
        right: 0;
        top: 50svh;
        margin-top: -1.35em;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.35em;
        color: var(--muted-color);
        font-size: clamp(16px, 1.9vw, 30px);
        font-weight: 500;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        pointer-events: none;
      }
      .scroll-hint .arrow {
        display: block;
        width: 1em;
        height: 1em;
        animation: nudge 1.8s ease-in-out infinite;
      }
      .scroll-hint .arrow-light,
      [data-theme="light"] .scroll-hint .arrow-dark {
        display: none;
      }
      [data-theme="light"] .scroll-hint .arrow-light {
        display: block;
      }
      @keyframes nudge {
        0%,
        100% {
          margin-top: 0;
          opacity: 0.9;
        }
        50% {
          margin-top: 0.3em;
          opacity: 0.4;
        }
      }
      .pill-anchor {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: flex;
        justify-content: center;
        align-items: center;
        pointer-events: none;
        opacity: 0;
        transform: translateY(14px) scale(0.96);
        transition:
          opacity 0.6s cubic-bezier(0.22, 1, 0.36, 1),
          transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .pill-anchor.show {
        opacity: 1;
        transform: none;
      }
      .pill-anchor.show a {
        pointer-events: auto;
      }
      .email-wrap {
        display: inline-block;
        text-decoration: none;
      }
      .email-pill {
        border-radius: 999px;
        padding: 1.05rem 2.6rem;
        background: var(--pill-bg);
        -webkit-backdrop-filter: blur(18px) saturate(180%);
        backdrop-filter: blur(18px) saturate(180%);
        box-shadow:
          0 12px 32px var(--glass-shadow),
          0 0 0 0.5px var(--glass-ring),
          inset 0 -1px 1px var(--glass-depth);
        transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      .email-wrap:hover .email-pill {
        transform: scale(1.04);
      }
      .email-wrap:active .email-pill {
        transform: scale(0.97);
      }
      .email-pill span {
        color: var(--accent);
        font-size: 1rem;
        font-weight: 400;
        letter-spacing: -0.02em;
      }

      footer.lens {
        position: fixed;
        left: 24px;
        right: 24px;
        bottom: calc(24px + env(safe-area-inset-bottom));
        z-index: 10000;
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        padding: 1.05rem 2rem;
        border-radius: 999px;
        background: var(--pill-bg);
        -webkit-backdrop-filter: blur(18px) saturate(180%);
        backdrop-filter: blur(18px) saturate(180%);
        box-shadow:
          0 12px 32px var(--glass-shadow),
          0 0 0 0.5px var(--glass-ring),
          inset 0 -1px 1px var(--glass-depth);
        color: var(--muted-color);
        font-size: 0.78rem;
        font-weight: 400;
        letter-spacing: -0.01em;
        font-variant-numeric: tabular-nums;
      }
      #clock-wrap {
        pointer-events: auto;
        cursor: pointer;
      }
      .footer-mid {
        opacity: 0.55;
        text-align: center;
      }
      .footer-right {
        text-align: right;
      }
      @media (hover: none) {
        .footer-mid {
          display: none;
        }
        footer.lens {
          grid-template-columns: auto auto;
          justify-content: space-between;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .scroll-hint .arrow {
          animation: none;
        }
        #theme-toggle,
        .email-pill,
        .pill-anchor,
        body {
          transition: none;
        }
      }
      @media (hover: none) and (pointer: coarse) {
        .scroll-hint .arrow {
          animation: pulse 1.8s ease-in-out infinite;
        }
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 0.9;
        }
        50% {
          opacity: 0.3;
        }
      }

      @media (max-width: 768px) and (orientation: portrait) {
        :root {
          --pane-h: 54vh;
        }
        .shape,
        .mask {
          position: fixed;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
          width: calc(90vw - env(safe-area-inset-left) - env(safe-area-inset-right));
          height: var(--pane-h);
          border-radius: 5vw;
        }
        .banner-text-container {
          max-width: 86%;
          padding-top: 82svh;
          padding-bottom: 74svh;
        }
        .banner-text {
          font-size: clamp(44px, 15vw, 88px);
          margin: 0 auto 68vh;
        }
        #name {
          margin: 0 auto calc(68vh - 0.8em);
        }
        .banner-text.small {
          font-size: clamp(18px, 5.4vw, 28px);
          line-height: 1.2;
          max-width: 70vw;
          text-wrap: balance;
        }
        .scroll-hint {
          font-size: 4.2vw;
        }
        .glow {
          width: 80vmin;
          height: 80vmin;
        }
        .top-nav {
          padding: calc(14px + env(safe-area-inset-top)) 18px 18px;
        }
        #theme-toggle {
          width: 48px;
          height: 48px;
        }
        .email-pill {
          padding: 0.95rem 2.2rem;
        }
        .email-pill span {
          font-size: 0.92rem;
        }
        footer.lens {
          left: 14px;
          right: 14px;
          bottom: calc(14px + env(safe-area-inset-bottom));
          padding: 0.85rem 1.2rem;
          font-size: 0.68rem;
          gap: 12px;
        }
      }
      @media (max-height: 520px) and (orientation: landscape) {
        :root {
          --pad: 8vh;
          --radius: 4vh;
          --pane-h: calc(100vh - 2 * var(--pad));
        }
        .shape,
        .mask {
          left: calc(14vw + env(safe-area-inset-left));
          width: calc(72vw - env(safe-area-inset-left) - env(safe-area-inset-right));
        }
        .banner-text {
          font-size: clamp(40px, 12vh, 72px);
        }
        .banner-text.small {
          font-size: clamp(16px, 4vh, 24px);
        }
        .scroll-hint {
          font-size: clamp(13px, 3.2vh, 18px);
        }
        .top-nav {
          padding: 14px calc(18px + env(safe-area-inset-right)) 14px 18px;
        }
        #theme-toggle {
          width: 44px;
          height: 44px;
        }
        footer.lens {
          left: calc(14px + env(safe-area-inset-left));
          right: calc(14px + env(safe-area-inset-right));
          bottom: 10px;
          padding: 0.6rem 1.2rem;
          font-size: 0.66rem;
        }
      }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>
    <script src="scripts/liquidGL.js?v=8.3.0" defer></script>
  </head>

      <img class="glow" alt="" style="right: -18vmin; top: 60svh" src="data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%20200%20200%27%3E%3Cdefs%3E%3CradialGradient%20id%3D%27g%27%3E%3Cstop%20offset%3D%270%27%20stop-color%3D%27%23ff7a59%27%20stop-opacity%3D%271%27%2F%3E%3Cstop%20offset%3D%270.55%27%20stop-color%3D%27%23ff7a59%27%20stop-opacity%3D%270.35%27%2F%3E%3Cstop%20offset%3D%271%27%20stop-color%3D%27%23ff7a59%27%20stop-opacity%3D%270%27%2F%3E%3C%2FradialGradient%3E%3C%2Fdefs%3E%3Ccircle%20cx%3D%27100%27%20cy%3D%27100%27%20r%3D%27100%27%20fill%3D%27url%28%23g%29%27%2F%3E%3C%2Fsvg%3E" />
      <img class="glow" alt="" style="left: -10vmin; top: calc(86svh + var(--pane-h) + 30vh)" src="data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%20200%20200%27%3E%3Cdefs%3E%3CradialGradient%20id%3D%27g%27%3E%3Cstop%20offset%3D%270%27%20stop-color%3D%27%238e5cff%27%20stop-opacity%3D%271%27%2F%3E%3Cstop%20offset%3D%270.55%27%20stop-color%3D%27%238e5cff%27%20stop-opacity%3D%270.35%27%2F%3E%3Cstop%20offset%3D%271%27%20stop-color%3D%27%238e5cff%27%20stop-opacity%3D%270%27%2F%3E%3C%2FradialGradient%3E%3C%2Fdefs%3E%3Ccircle%20cx%3D%27100%27%20cy%3D%27100%27%20r%3D%27100%27%20fill%3D%27url%28%23g%29%27%2F%3E%3C%2Fsvg%3E" />
      <img class="glow" alt="" style="right: -12vmin; top: calc(86svh + 2 * var(--pane-h) + 40vh)" src="data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%20200%20200%27%3E%3Cdefs%3E%3CradialGradient%20id%3D%27g%27%3E%3Cstop%20offset%3D%270%27%20stop-color%3D%27%232fd3a5%27%20stop-opacity%3D%271%27%2F%3E%3Cstop%20offset%3D%270.55%27%20stop-color%3D%27%232fd3a5%27%20stop-opacity%3D%270.35%27%2F%3E%3Cstop%20offset%3D%271%27%20stop-color%3D%27%232fd3a5%27%20stop-opacity%3D%270%27%2F%3E%3C%2FradialGradient%3E%3C%2Fdefs%3E%3Ccircle%20cx%3D%27100%27%20cy%3D%27100%27%20r%3D%27100%27%20fill%3D%27url%28%23g%29%27%2F%3E%3C%2Fsvg%3E" />
      </div>
      <div class="scroll-hint" id="scroll-hint" data-liquidgl-hide>
        <span>scroll</span>
        <img class="arrow arrow-dark" alt="" src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2386868b' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E" />
        <img class="arrow arrow-light" alt="" src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236e6e73' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E" />
      </div>
      <span class="runner" id="runner" aria-hidden="true">i</span>
      <div class="banner-text-container">
        <div class="banner-text" id="name">
          <span class="word"><span class="i">i</span>Nabeel</span>
          <span class="think" aria-hidden="true">Think different.</span>
        </div>
        <div class="banner-text small">Building things on the internet</div>
        <div id="end-sentinel" aria-hidden="true"></div>
      </div>
    </div>

    <div class="mask" aria-hidden="true"></div>

    <div class="shape"></div>

    <div class="top-nav">
      <button id="theme-toggle" class="lens" aria-label="Toggle Theme">
        <svg id="sun-icon" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg id="moon-icon" viewBox="0 0 24 24">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </div>


    <div class="pill-anchor" id="pill-anchor">
      <a href="mailto:x@nabeel.ca" class="email-wrap">
        <div class="email-pill lens">
          <span>x@nabeel.ca</span>
        </div>
      </a>
    </div>

    <footer class="lens">
      <div class="footer-left">
        © <span id="year"></span> Nabeel. All rights reserved
      </div>
      <div class="footer-mid">Try typing apple</div>
      <div class="footer-right" id="clock-wrap">
        San Francisco, CA. <span id="clock">00:00:00</span>
      </div>
    </footer>

    <script>
      const root = document.documentElement;
      const themeToggle = document.getElementById("theme-toggle");
      function syncChrome() {
        const light = root.getAttribute("data-theme") === "light";
        document
          .getElementById("theme-color")
          .setAttribute("content", light ? "#f5f5f7" : "#000000");
      }
      function syncArrow() {
        const a = document.getElementById("arrow-touch");
        if (!a || !window.__arrowSrc) return;
        const light = root.getAttribute("data-theme") === "light";
        const want = light ? window.__arrowSrc.light : window.__arrowSrc.dark;
        if (a.src !== want) a.src = want;
      }
      let transitionBusy = false;
      function transitionWith(apply, fast) {
        const recapture = async () => {
          const r = window.__liquidGLRenderer__;
          if (r && r.captureSnapshot) await r.captureSnapshot();
        };
        if (transitionBusy) {
          apply();
          return recapture();
        }
        root.classList.toggle("vt-fast", !!fast);
        if (document.startViewTransition) {
          transitionBusy = true;
          const vt = document.startViewTransition(async () => {
            apply();
            await recapture();
          });
          vt.ready.catch(() => {});
          vt.updateCallbackDone.catch(() => {});
          return vt.finished
            .catch(() => {})
            .finally(() => (transitionBusy = false));
        }
        apply();
        return recapture();
      }
      function setTheme(theme) {
        transitionWith(() => {
          if (theme === "dark") root.removeAttribute("data-theme");
          else root.setAttribute("data-theme", "light");
          localStorage.setItem("theme", theme);
          syncChrome();
          syncArrow();
          forceLive([nameEl]);
        });
      }
      if (localStorage.getItem("theme") === "light") root.setAttribute("data-theme", "light");
      syncChrome();
      themeToggle.addEventListener("click", () =>
        setTheme(root.getAttribute("data-theme") === "light" ? "dark" : "light"),
      );

      const pillAnchor = document.getElementById("pill-anchor");
      let lastY = -1;
      let lastH = -1;
      (function watchScroll() {
        const y = window.scrollY;
        const h = document.documentElement.scrollHeight;
        if (y !== lastY || h !== lastH) {
          lastY = y;
          lastH = h;
          pillAnchor.classList.toggle("show", window.innerHeight + y >= h - 4);
        }
        requestAnimationFrame(watchScroll);
      })();

      const fireworks = confetti.create(null, { resize: true, useWorker: false });
      function fireworksShow() {
        const end = Date.now() + 2500;
        const colors = ["#ff2d78", "#ff7a1a", "#b06bff", "#4db8ff", "#ffffff"];
        (function fire() {
          fireworks({
            particleCount: 45,
            startVelocity: 32,
            spread: 360,
            ticks: 70,
            gravity: 0.9,
            origin: { x: 0.15 + Math.random() * 0.7, y: 0.15 + Math.random() * 0.4 },
            colors,
            zIndex: 20000,
            disableForReducedMotion: true,
          });
          if (Date.now() < end) setTimeout(fire, 180 + Math.random() * 140);
        })();
      }

      const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
      const nameEl = document.getElementById("name");
      const runner = document.getElementById("runner");
      const wordEl = nameEl.querySelector(".word");
      const thinkEl = nameEl.querySelector(".think");
      const mainEl = document.querySelector(".main-content");
      function placeRunners() {
        const cs = getComputedStyle(nameEl);
        const em = parseFloat(cs.fontSize);
        const nameRect = nameEl.getBoundingClientRect();
        const mainRect = mainEl.getBoundingClientRect();
        const top = nameRect.top - mainRect.top + 0.4 * em;
        runner.style.fontSize = cs.fontSize;
        runner.style.top = `${top}px`;
        return { em, nameRect, mainRect, offX: nameRect.left - mainRect.left };
      }
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

      function liveNode(el, on) {
        const r = window.__liquidGLRenderer__;
        if (!r) return;
        if (on) {
          liquidGL.registerDynamic(el);
          return;
        }
        r._dynamicNodes = r._dynamicNodes.filter((n) => n.el !== el);
        r._dynMeta?.delete(el);
      }

      function forceLive(els) {
        const r = window.__liquidGLRenderer__;
        if (!r) return;
        els.forEach((el) => {
          const m = r._dynMeta?.get(el);
          if (m) m.needsRecapture = true;
        });
        r.render();
      }
      let nameDirtyUntil = 0;
      function dirtyName(ms) {
        nameDirtyUntil = Math.max(nameDirtyUntil, performance.now() + ms);
      }
      function liveLoop(extra, isOn) {
        (function tick() {
          const r = window.__liquidGLRenderer__;
          if (!isOn()) {
            if (r) r._fastDynamic = false;
            return;
          }
          if (r) {
            r._fastDynamic = performance.now() < nameDirtyUntil;
            if (performance.now() < nameDirtyUntil) {
              const m = r._dynMeta?.get(nameEl);
              if (m) m.needsRecapture = true;
            }
            (extra || []).forEach((el) => {
              const m = r._dynMeta?.get(el);
              if (m) m.needsRecapture = true;
            });
            r.render();
          }
          requestAnimationFrame(tick);
        })();
      }

      async function bringNameIntoPane() {
        const rect = nameEl.getBoundingClientRect();
        const centre = rect.top + rect.height / 2;
        if (centre > innerHeight * 0.36 && centre < innerHeight * 0.64) return;
        window.scrollTo({ top: scrollY + centre - innerHeight / 2, behavior: "smooth" });
        await sleep(900);
      }

      let crashBusy = false;
      async function appleShow() {
        if (crashBusy) return;
        crashBusy = true;
        const r = window.__liquidGLRenderer__;
        if (nameEl.classList.contains("crashed")) {
          await appleUndo();
          crashBusy = false;
          return;
        }
        if (reduceMotion) {
          nameEl.classList.add("retro", "crashed");
          forceLive([nameEl]);
          crashBusy = false;
          return;
        }
        await bringNameIntoPane();
        liveNode(runner, true);
        let animating = true;
        dirtyName(900);
        liveLoop([], () => animating);
        await wordEl.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 380, easing: "ease-in", fill: "forwards" }).finished;
        nameEl.classList.add("retro");
        wordEl.getAnimations().forEach((a) => a.cancel());
        await wordEl.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 420, easing: "ease-out" }).finished;

        const geo = placeRunners();
        runner.classList.add("running");
        nameEl.classList.add("thinking");
        dirtyName(900);
        thinkEl.animate(
          [{ opacity: 0, bottom: "-0.25em" }, { opacity: 1, bottom: "0.12em" }],
          { duration: 620, easing: "cubic-bezier(0.22, 1, 0.36, 1)", fill: "backwards" },
        );
        const wordRect = wordEl.getBoundingClientRect();
        const runnerW = runner.getBoundingClientRect().width;
        const stopLeft = wordRect.left - geo.mainRect.left - runnerW;
        await runner.animate(
          [{ left: "-60vw" }, { left: `${stopLeft}px` }],
          { duration: 620, easing: "cubic-bezier(0.7, 0, 1, 1)", fill: "forwards" },
        ).finished;

        runner.classList.remove("running");
        nameEl.classList.add("crashed");
        nameEl.classList.remove("thinking");
        dirtyName(800);
        const hit = wordEl.getBoundingClientRect();
        [hit.left].forEach((x) =>
          fireworks({
            particleCount: 22,
            spread: 70,
            startVelocity: 24,
            ticks: 50,
            gravity: 1,
            scalar: 0.7,
            origin: { x: x / innerWidth, y: (hit.top + hit.height * 0.55) / innerHeight },
            colors: ["#f5f5f7", "#86868b", "#c9c9ce"],
            zIndex: 20000,
            disableForReducedMotion: true,
          }),
        );
        await nameEl.animate(
          [
            { left: "0px" },
            { left: "0.24em", offset: 0.18 },
            { left: "-0.1em", offset: 0.45 },
            { left: "0.04em", offset: 0.72 },
            { left: "0px" },
          ],
          { duration: 720, easing: "ease-out" },
        ).finished;

        animating = false;
        liveNode(runner, false);
        forceLive([nameEl]);
        crashBusy = false;
      }

      async function appleUndo() {
        const r = window.__liquidGLRenderer__;
        if (reduceMotion) {
          nameEl.classList.remove("retro", "crashed");
          forceLive([nameEl]);
          return;
        }
        await bringNameIntoPane();
        liveNode(runner, true);
        let animating = true;
        dirtyName(1300);
        liveLoop([], () => animating);

        const thinkOut = thinkEl.animate(
          [{ opacity: 1, bottom: "0.12em" }, { opacity: 0, bottom: "-0.3em" }],
          { duration: 520, easing: "cubic-bezier(0.4, 0, 1, 1)", fill: "forwards" },
        ).finished;
        const geo = placeRunners();
        const iRect = wordEl.querySelector(".i").getBoundingClientRect();
        runner.style.left = `${iRect.left - geo.mainRect.left}px`;
        runner.classList.add("running");
        nameEl.classList.add("leaving");
        nameEl.animate(
          [{ left: "0px" }, { left: "-0.12em", offset: 0.25 }, { left: "0px" }],
          { duration: 520, easing: "ease-out" },
        );
        await Promise.all([
          runner.animate(
            [{ left: runner.style.left }, { left: "-60vw" }],
            { duration: 640, easing: "cubic-bezier(0.6, 0, 1, 1)", fill: "forwards" },
          ).finished,
          thinkOut,
        ]);
        runner.classList.remove("running");
        runner.style.left = "";
        nameEl.classList.remove("crashed");
        nameEl.classList.add("leaving", "hold");
        thinkEl.getAnimations().forEach((a) => a.cancel());

        dirtyName(900);
        await wordEl.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 380, easing: "ease-in", fill: "forwards" }).finished;
        nameEl.classList.remove("retro", "crashed", "leaving", "hold");
        wordEl.getAnimations().forEach((a) => a.cancel());
        await wordEl.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 420, easing: "ease-out" }).finished;
        animating = false;
        liveNode(runner, false);
        forceLive([nameEl]);
      }

      const paneEl = document.querySelector(".shape");
      const hintEl = document.getElementById("scroll-hint");
      function inside(e, r, pad) {
        return (
          e.clientX >= r.left - pad &&
          e.clientX <= r.right + pad &&
          e.clientY >= r.top - pad &&
          e.clientY <= r.bottom + pad
        );
      }
      function overHint(e) {
        const r = hintEl.getBoundingClientRect();
        return r.bottom > 0 && inside(e, r, 28);
      }
      document.addEventListener("mousemove", (e) => {
        document.body.style.cursor = overHint(e) ? "pointer" : "";
      });
      document.addEventListener("click", (e) => {
        if (e.target instanceof Element && e.target.closest("a, button")) return;
        if (!overHint(e)) return;
        const rect = nameEl.getBoundingClientRect();
        window.scrollTo({
          top: scrollY + rect.top + rect.height / 2 - innerHeight / 2,
          behavior: "smooth",
        });
      });

      let tapCount = 0;
      let tapTimer = null;
      document.addEventListener("pointerup", (e) => {
        if (e.target instanceof Element && e.target.closest("a, button")) return;
        if (!inside(e, paneEl.getBoundingClientRect(), 0)) return;
        tapCount += 1;
        clearTimeout(tapTimer);
        tapTimer = setTimeout(() => (tapCount = 0), 500);
        if (tapCount === 3) {
          tapCount = 0;
          appleShow();
        }
      });

      let inputBuffer = "";
      const secrets = {
        dark: () => setTheme("dark"),
        light: () => setTheme("light"),
        nabeel: fireworksShow,
        apple: appleShow,
      };
      window.addEventListener("keydown", (e) => {
        if (e.key.length !== 1) return;
        inputBuffer = (inputBuffer + e.key.toLowerCase()).slice(-10);
        for (const word in secrets) {
          if (inputBuffer.includes(word)) {
            secrets[word]();
            inputBuffer = "";
          }
        }
      });

      ["gesturestart", "gesturechange", "gestureend"].forEach((t) =>
        document.addEventListener(t, (e) => e.preventDefault(), { passive: false }),
      );
      document.addEventListener(
        "touchmove",
        (e) => {
          if (e.scale !== undefined && e.scale !== 1) e.preventDefault();
        },
        { passive: false },
      );
      let lastTouchEnd = 0;
      document.addEventListener(
        "touchend",
        (e) => {
          const now = Date.now();
          if (now - lastTouchEnd < 300) e.preventDefault();
          lastTouchEnd = now;
        },
        { passive: false },
      );

      document.getElementById("year").textContent = new Date().getFullYear();
      let clockZone = "America/Los_Angeles";
      const clockWrap = document.getElementById("clock-wrap");
      clockWrap.addEventListener("click", () => {
        clockZone = clockZone === "UTC" ? "America/Los_Angeles" : "UTC";
        clockWrap.firstChild.textContent =
          clockZone === "UTC" ? "\n        UTC. " : "\n        San Francisco, CA. ";
        updateClock();
      });
      function updateClock() {
        document.getElementById("clock").textContent = new Intl.DateTimeFormat([], {
          timeZone: clockZone,
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hour12: false,
        }).format(new Date());
      }
      setInterval(updateClock, 1000);
      updateClock();

      document.addEventListener("DOMContentLoaded", () => {
        if (typeof liquidGL !== "function") return;
        nameEl.setAttribute("data-liquidgl-hide", "");
        if (document.fonts && document.fonts.load) document.fonts.load('400 1em "EB Garamond"').catch(() => {});
        liquidGL({
          target: ".shape",
          snapshot: ".main-content",
          refraction: 0.026,
          bevelDepth: 0.119,
          bevelWidth: 0.057,
          frost: 0,
          specular: true,
          shadow: true,
          reveal: "fade",
          resolution: Math.min(3, window.devicePixelRatio || 1),
        });
        liquidGL.registerDynamic("#name");
        const touchOnly = matchMedia("(hover: none) and (pointer: coarse)").matches;
        if (touchOnly) {
          const hint = document.getElementById("scroll-hint");
          hint.removeAttribute("data-liquidgl-hide");
          const dark = hint.querySelector(".arrow-dark");
          const light = hint.querySelector(".arrow-light");
          window.__arrowSrc = { dark: dark.src, light: light.src };
          light.remove();
          dark.classList.remove("arrow-dark");
          dark.id = "arrow-touch";
          dark.setAttribute("data-liquidgl-hide", "");
          syncArrow();
          liquidGL.registerDynamic("#arrow-touch");
          (function idle() {
            const r = window.__liquidGLRenderer__;
            if (r && !document.hidden && scrollY < innerHeight) r.render();
            setTimeout(() => requestAnimationFrame(idle), 66);
          })();
        } else {
          liquidGL.registerDynamic("#scroll-hint");
        }
        let resizeTimer = null;
        window.addEventListener("resize", () => {
          clearTimeout(resizeTimer);
          resizeTimer = setTimeout(() => {
            forceLive([document.getElementById("scroll-hint"), nameEl]);
          }, 600);
        });
        window.addEventListener("load", () => {
          liquidGL.syncWith();
          setTimeout(() => document.body.classList.add("ready"), 250);
        });
        setTimeout(() => document.body.classList.add("ready"), 1800);
        document.addEventListener("mousemove", () => {
          if (window.__liquidGLRenderer__) window.__liquidGLRenderer__.render();
        });
        let settleTimer = null;
        document.addEventListener("scroll", () => {
          const r = window.__liquidGLRenderer__;
          if (!r) return;
          r.render();
          clearTimeout(settleTimer);
          settleTimer = setTimeout(() => {
            r.render();
            setTimeout(() => r.render(), 300);
          }, 320);
        });
      });

      console.log(
        "%cNABEEL",
        "color: #ffffff; font-family: monospace; font-size: 24px; font-weight: bold; padding: 10px 0;",
      );
      console.log(
        "%cYou found the console. Try typing 'apple' on the page ;)",
        "color: #a3a3a3; font-family: monospace; font-size: 12px;",
      );
    </script>
  </body>
