  <body>
    <main class="main-content">
      <div class="toolbar-cover" data-liquid-ignore aria-hidden="true"></div>

      <div class="glows" aria-hidden="true">
        <img class="glow glow--blue" src="/assets/glow-blue.svg" alt="" width="200" height="200" decoding="async" />
        <img class="glow glow--coral" src="/assets/glow-coral.svg" alt="" width="200" height="200" decoding="async" />
        <img class="glow glow--violet" src="/assets/glow-violet.svg" alt="" width="200" height="200" decoding="async" />
        <img class="glow glow--teal" src="/assets/glow-teal.svg" alt="" width="200" height="200" decoding="async" />
      </div>

      <div class="scroll-hint" id="scroll-hint" data-liquidgl-hide>
        <span>scroll</span>
        <img class="scroll-hint__arrow scroll-hint__arrow--dark" src="/assets/chevron-dark.svg" alt="" width="24" height="24" />
        <img class="scroll-hint__arrow scroll-hint__arrow--light" src="/assets/chevron-light.svg" alt="" width="24" height="24" />
      </div>

      <span class="runner" id="runner" aria-hidden="true">i</span>

      <div class="banner-text-container">
        <h1 class="banner-text banner-text--name" id="name">
          <span class="word"><span class="i">i</span>Nabeel</span>
          <span class="think" aria-hidden="true">Think different.</span>
        </h1>
        <p class="banner-text banner-text--small">Building things on the internet</p>
      </div>
    </main>

    <div class="pane-mask" aria-hidden="true"></div>
    <div class="pane" aria-hidden="true"></div>

    <header class="top-nav">
      <button class="theme-toggle glass lens press" id="theme-toggle" type="button" aria-label="Toggle theme">
        <svg class="theme-toggle__icon theme-toggle__icon--sun" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg class="theme-toggle__icon theme-toggle__icon--moon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </header>

    <div class="pill-anchor" id="pill-anchor">
      <a class="pill-link" href="mailto:x@nabeel.ca">
        <span class="pill glass lens"><span>x@nabeel.ca</span></span>
      </a>

      <button class="scroll-dots__dot" type="button" aria-label="Email" aria-current="false"><span></span></button>
    </nav>

      <div class="site-footer__left">&copy; <span id="year"></span> Nabeel. All rights reserved</div>
      <div class="site-footer__mid">Try typing apple</div>
      <div class="site-footer__right">
