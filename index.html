<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" id="theme-color" content="#ececee" />
    <title>Nabeel</title>

    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="favicon.png" />

    <meta name="title" content="Nabeel" />
    <meta name="description" content="Personal site of Nabeel." />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nabeel.ca/" />
    <meta property="og:title" content="Nabeel" />
    <meta property="og:description" content="Personal site of Nabeel." />
    <meta property="og:image" content="https://nabeel.ca/og-image.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://nabeel.ca/" />
    <meta name="twitter:title" content="Nabeel" />
    <meta name="twitter:description" content="Personal site of Nabeel." />
    <meta name="twitter:image" content="https://nabeel.ca/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ————— theme tokens ————— */
      :root {
        --bg-color: #101014;
        --text-color: #f5f5f7;
        --muted-color: #a1a1a8;
        --sheen-hi: rgba(255, 255, 255, 0.16);
        --sheen-mid: rgba(255, 255, 255, 0.05);
        --sheen-rim: rgba(255, 255, 255, 0.28);
        --pill-bg: rgba(255, 255, 255, 0.08);
      }
      [data-theme="light"] {
        --bg-color: #ececee;
        --text-color: #111114;
        --muted-color: #6e6e75;
        --sheen-hi: rgba(255, 255, 255, 0.5);
        --sheen-mid: rgba(255, 255, 255, 0.14);
        --sheen-rim: rgba(255, 255, 255, 0.9);
        --pill-bg: rgba(255, 255, 255, 0.62);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        user-select: none;
        -webkit-user-select: none;
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter",
          "Helvetica Neue", Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      html {
        background-color: var(--bg-color);
      }
      body {
        background-color: var(--bg-color);
        color: var(--text-color);
        overscroll-behavior-y: none;
      }

      /* theme switch = one crossfade of the whole rendered page (glass
         canvas included) via the View Transitions API */
      ::view-transition-old(root),
      ::view-transition-new(root) {
        animation-duration: 0.45s;
        animation-timing-function: ease-in-out;
      }

      /* ————— the scrolling column the pane refracts (liquidGL demo-5) ————— */
      .main-content {
        position: relative;
        background: var(--bg-color);
      }
      .banner-text-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        max-width: 60%;
        margin: 0 auto;
        padding-top: 150svh;
        padding-bottom: 120svh;
      }
      .banner-text {
        width: 100%;
        text-align: center;
        margin: 40vh auto;
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter",
          "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-size: 7vw;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: -0.02em;
        line-height: 0.9;
        color: var(--text-color);
        pointer-events: none;
      }
      .banner-text.small {
        font-size: 3.4vw;
        font-weight: 600;
        letter-spacing: -0.01em;
        line-height: 1;
        color: var(--muted-color);
      }
      /* retro six-colour Apple stripes — secret (type "apple") */
      .banner-text.retro {
        background: linear-gradient(
          180deg,
          #61bb46 0% 16.6%,
          #fdb827 16.6% 33.3%,
          #f5821f 33.3% 50%,
          #e03a3e 50% 66.6%,
          #963d97 66.6% 83.3%,
          #009ddc 83.3% 100%
        );
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
      }

      /* ————— the single fixed lens (demo-5 .shape, verbatim) ————— */
      .shape {
        position: fixed;
        top: 10vw;
        left: 10vw;
        width: calc(100vw - 20vw);
        height: calc(100vh - 20vw);
        border-radius: 2vw;
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(20px) saturate(180%);
        will-change: transform;
        pointer-events: auto;
        z-index: 9999;
      }

      /* ————— small glass controls: sheen + rim like the liquidGL homepage pill ————— */
      .lens {
        position: relative;
        overflow: clip;
        will-change: transform;
      }
      .lens::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        z-index: 2;
        pointer-events: none;
        background: linear-gradient(
          125deg,
          var(--sheen-hi) 0%,
          var(--sheen-mid) 34%,
          rgba(255, 255, 255, 0) 62%
        );
        box-shadow: inset 0 1px 1px var(--sheen-rim);
      }
      .lens > * {
        position: relative;
        z-index: 3;
      }

      /* theme toggle */
      .top-nav {
        position: fixed;
        top: 0;
        right: 0;
        padding: 32px 40px;
        z-index: 10000;
      }
      #theme-toggle {
        pointer-events: auto !important;
        width: 53px;
        height: 53px;
        border: none;
        background: transparent;
        border-radius: 999px;
        color: var(--text-color);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        outline: none;
        -webkit-tap-highlight-color: transparent;
        transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      #theme-toggle:hover {
        transform: scale(1.04);
      }
      #theme-toggle:active {
        transform: scale(0.97);
      }
      #theme-toggle svg {
        position: absolute;
        z-index: 3;
        width: 17px;
        height: 17px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
        transition:
          transform 0.6s cubic-bezier(0.4, 0, 0.2, 1),
          opacity 0.4s ease;
      }
      #sun-icon {
        opacity: 1;
        transform: rotate(0deg);
      }
      #moon-icon {
        opacity: 0;
        transform: rotate(-90deg);
      }
      [data-theme="light"] #sun-icon {
        opacity: 0;
        transform: rotate(90deg);
      }
      [data-theme="light"] #moon-icon {
        opacity: 1;
        transform: rotate(0deg);
      }

      /* scroll hint below the pane; fades out once you scroll */
      .scroll-hint {
        position: fixed;
        left: 50%;
        bottom: calc(10vw * 0.5 + 8px);
        transform: translateX(-50%);
        z-index: 10000;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        color: var(--muted-color);
        font-size: 0.72rem;
        font-weight: 500;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        pointer-events: none;
        transition: opacity 0.6s ease;
      }
      .scroll-hint svg {
        width: 14px;
        height: 14px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
        animation: nudge 1.8s ease-in-out infinite;
      }
      @keyframes nudge {
        0%,
        100% {
          transform: translateY(0);
          opacity: 0.9;
        }
        50% {
          transform: translateY(5px);
          opacity: 0.4;
        }
      }
      .scroll-hint.gone {
        opacity: 0;
      }

      /* email pill: appears centred on the pane once you reach the end */
      /* the pill is CSS glass (not a WebGL lens): the library has no per-lens
         show/hide, and its canvas would draw the lens even while the pill is
         hidden. On a flat field the look is identical: same sheen, same rim,
         the library's own shadow values. */
      .pill-anchor {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: flex;
        justify-content: center;
        align-items: center;
        pointer-events: none;
        opacity: 0;
        transform: translateY(14px) scale(0.96);
        transition:
          opacity 0.6s cubic-bezier(0.22, 1, 0.36, 1),
          transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .pill-anchor.show {
        opacity: 1;
        transform: none;
      }
      .pill-anchor.show a {
        pointer-events: auto;
      }
      .email-wrap {
        display: inline-block;
        text-decoration: none;
      }
      .email-pill {
        border-radius: 999px;
        padding: 1.05rem 2.6rem;
        background: var(--pill-bg);
        -webkit-backdrop-filter: blur(14px) saturate(160%);
        backdrop-filter: blur(14px) saturate(160%);
        box-shadow:
          0 10px 30px rgba(0, 0, 0, 0.1),
          0 0 0 0.5px rgba(0, 0, 0, 0.05);
        transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      .email-wrap:hover .email-pill {
        transform: scale(1.04);
      }
      .email-wrap:active .email-pill {
        transform: scale(0.97);
      }
      .email-pill span {
        color: var(--text-color);
        font-size: 0.98rem;
        font-weight: 500;
        letter-spacing: -0.01em;
      }

      /* footer: long glass pill pinned to the viewport */
      footer.lens {
        position: fixed;
        left: 24px;
        right: 24px;
        bottom: calc(24px + env(safe-area-inset-bottom));
        z-index: 10000;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1.05rem 2rem;
        border-radius: 999px;
        color: var(--muted-color);
        font-size: 0.78rem;
        font-weight: 500;
        letter-spacing: 0.01em;
      }
      #clock-wrap {
        pointer-events: auto;
        cursor: pointer;
      }

      @media (max-width: 768px) {
        /* demo-5 mobile pane, verbatim */
        .shape {
          position: fixed;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
          width: calc(80vw);
          height: calc(50vh);
          border-radius: 4vw;
        }
        .banner-text-container {
          max-width: 78%;
        }
        .banner-text {
          font-size: 14vw;
          margin: 34vh auto;
        }
        .banner-text.small {
          font-size: 6.4vw;
        }
        .top-nav {
          padding: calc(14px + env(safe-area-inset-top)) 18px 18px;
        }
        #theme-toggle {
          width: 48px;
          height: 48px;
        }
        .scroll-hint {
          /* between the pane's bottom edge (25vh) and the footer */
          bottom: calc(25vh - 62px);
        }
        .email-pill {
          padding: 0.95rem 2.2rem;
        }
        .email-pill span {
          font-size: 0.92rem;
        }
        footer.lens {
          left: 14px;
          right: 14px;
          bottom: calc(14px + env(safe-area-inset-bottom));
          padding: 0.85rem 1.2rem;
          font-size: 0.68rem;
          gap: 12px;
        }
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>
    <script src="scripts/liquidGL.js" defer></script>
  </head>
  <body>
    <!-- everything that scrolls under the pane lives in here -->
    <div class="main-content">
      <div class="banner-text-container">
        <div class="banner-text" id="name">Nabeel</div>
        <div class="banner-text small">building things on the internet</div>
        <div id="end-sentinel" aria-hidden="true"></div>
      </div>
    </div>

    <!-- the single lens (demo-5) -->
    <div class="shape"></div>

    <div class="top-nav">
      <button id="theme-toggle" class="lens lg-flat" aria-label="Toggle Theme">
        <svg id="sun-icon" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg id="moon-icon" viewBox="0 0 24 24">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </div>

    <div class="scroll-hint" id="scroll-hint">
      <span>scroll</span>
      <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" /></svg>
    </div>

    <div class="pill-anchor" id="pill-anchor">
      <a href="mailto:x@nabeel.ca" class="email-wrap">
        <div class="email-pill lens">
          <span>x@nabeel.ca</span>
        </div>
      </a>
    </div>

    <footer class="lens lg-flat">
      <div class="footer-left">
        © <span id="year"></span> Nabeel. All rights reserved
      </div>
      <div class="footer-right" id="clock-wrap">
        San Francisco, CA. <span id="clock">00:00:00</span>
      </div>
    </footer>

    <script>
      // ————— theme —————
      const root = document.documentElement;
      const themeToggle = document.getElementById("theme-toggle");
      function syncChrome() {
        const light = root.getAttribute("data-theme") === "light";
        document
          .getElementById("theme-color")
          .setAttribute("content", light ? "#ececee" : "#101014");
      }
      let themeBusy = false;
      function setTheme(theme) {
        if (themeBusy) return;
        const apply = () => {
          if (theme === "dark") root.removeAttribute("data-theme");
          else root.setAttribute("data-theme", "light");
          localStorage.setItem("theme", theme);
          syncChrome();
        };
        // re-photograph the column so the glass takes the new colour; the
        // library hides its canvas while capturing, so do it behind a
        // frozen frame, never on screen
        const recapture = async () => {
          const r = window.__liquidGLRenderer__;
          if (r && r.captureSnapshot) await r.captureSnapshot();
        };
        if (document.startViewTransition) {
          themeBusy = true;
          const vt = document.startViewTransition(async () => {
            apply();
            await recapture();
          });
          vt.finished.finally(() => (themeBusy = false));
        } else {
          apply();
          recapture();
        }
      }
      if (localStorage.getItem("theme") === "dark") root.removeAttribute("data-theme");
      syncChrome();
      themeToggle.addEventListener("click", () =>
        setTheme(root.getAttribute("data-theme") === "light" ? "dark" : "light"),
      );

      // ————— scroll hint + end-of-page email reveal —————
      const scrollHint = document.getElementById("scroll-hint");
      const pillAnchor = document.getElementById("pill-anchor");
      function onScroll() {
        if (window.scrollY > 40) scrollHint.classList.add("gone");
        // reveal the email only once the page is scrolled all the way down
        const atBottom =
          window.innerHeight + window.scrollY >=
          document.documentElement.scrollHeight - 4;
        pillAnchor.classList.toggle("show", atBottom);
      }
      window.addEventListener("scroll", onScroll, { passive: true });
      window.addEventListener("resize", onScroll, { passive: true });

      // ————— fireworks (type "nabeel"), rendered in front of the glass —————
      const fireworks = confetti.create(null, { resize: true, useWorker: false });
      function fireworksShow() {
        const end = Date.now() + 2500;
        const colors = ["#ff2d78", "#ff7a1a", "#b06bff", "#4db8ff", "#ffffff"];
        (function fire() {
          fireworks({
            particleCount: 45,
            startVelocity: 32,
            spread: 360,
            ticks: 70,
            gravity: 0.9,
            origin: { x: 0.15 + Math.random() * 0.7, y: 0.15 + Math.random() * 0.4 },
            colors,
            zIndex: 20000,
            disableForReducedMotion: true,
          });
          if (Date.now() < end) setTimeout(fire, 180 + Math.random() * 140);
        })();
      }

      // ————— typed secrets —————
      const nameEl = document.getElementById("name");
      let inputBuffer = "";
      const secrets = {
        dark: () => setTheme("dark"),
        light: () => setTheme("light"),
        nabeel: fireworksShow,
        apple: () => {
          nameEl.classList.toggle("retro");
          const r = window.__liquidGLRenderer__;
          if (r && r.captureSnapshot) r.captureSnapshot();
        },
      };
      window.addEventListener("keydown", (e) => {
        if (e.key.length !== 1) return;
        inputBuffer = (inputBuffer + e.key.toLowerCase()).slice(-10);
        for (const word in secrets) {
          if (inputBuffer.includes(word)) {
            secrets[word]();
            inputBuffer = "";
          }
        }
      });

      // ————— footer clock (click flips SF ↔ UTC) —————
      document.getElementById("year").textContent = new Date().getFullYear();
      let clockZone = "America/Los_Angeles";
      const clockWrap = document.getElementById("clock-wrap");
      clockWrap.addEventListener("click", () => {
        clockZone = clockZone === "UTC" ? "America/Los_Angeles" : "UTC";
        clockWrap.firstChild.textContent =
          clockZone === "UTC" ? "\n        UTC. " : "\n        San Francisco, CA. ";
        updateClock();
      });
      function updateClock() {
        document.getElementById("clock").textContent = new Intl.DateTimeFormat([], {
          timeZone: clockZone,
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hour12: false,
        }).format(new Date());
      }
      setInterval(updateClock, 1000);
      updateClock();

      // ————— liquid glass: liquidGL (MIT, NaughtyDuk), demo-5 wiring —————
      document.addEventListener("DOMContentLoaded", () => {
        if (typeof liquidGL !== "function") return;
        // 1. the big pane refracts the scrolling column — demo-5, verbatim
        liquidGL({
          target: ".shape",
          snapshot: ".main-content",
          refraction: 0.026,
          bevelDepth: 0.119,
          bevelWidth: 0.057,
          frost: 0,
          specular: true,
          shadow: true,
          reveal: "fade",
        });
        // 2. small controls: the liquidGL homepage pill recipe
        liquidGL({
          target: ".lg-flat",
          snapshot: ".main-content",
          refraction: 0.01,
          bevelDepth: 0.119,
          bevelWidth: 0.057,
          frost: 0,
          specular: true,
          shadow: true,
          reveal: "fade",
          tilt: false,
        });
        // 3. Lenis + GSAP ticker sync (demo-5)
        window.addEventListener("load", () => liquidGL.syncWith());
        document.addEventListener("mousemove", () => {
          if (window.__liquidGLRenderer__) window.__liquidGLRenderer__.render();
        });
        document.addEventListener("scroll", () => {
          if (window.__liquidGLRenderer__) window.__liquidGLRenderer__.render();
        });
      });

      console.log(
        "%cNABEEL",
        "color: #ffffff; font-family: monospace; font-size: 24px; font-weight: bold; padding: 10px 0;",
      );
      console.log(
        "%cYou found the console. Try typing 'apple' on the page ;)",
        "color: #a3a3a3; font-family: monospace; font-size: 12px;",
      );
    </script>
  </body>
</html>
