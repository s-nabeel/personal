<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" id="theme-color" content="#ececee" />
    <title>Nabeel</title>

    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="favicon.png" />

    <meta name="title" content="Nabeel" />
    <meta name="description" content="Personal site of Nabeel." />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nabeel.ca/" />
    <meta property="og:title" content="Nabeel" />
    <meta property="og:description" content="Personal site of Nabeel." />
    <meta property="og:image" content="https://nabeel.ca/og-image.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://nabeel.ca/" />
    <meta name="twitter:title" content="Nabeel" />
    <meta name="twitter:description" content="Personal site of Nabeel." />
    <meta name="twitter:image" content="https://nabeel.ca/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ————— theme tokens ————— */
      :root {
        --bg-color: #101014;
        --text-color: #f5f5f7;
        --muted-color: #a1a1a8;
        --sheen-hi: rgba(255, 255, 255, 0.16);
        --sheen-mid: rgba(255, 255, 255, 0.05);
        --sheen-rim: rgba(255, 255, 255, 0.28);
      }
      [data-theme="light"] {
        --bg-color: #ececee;
        --text-color: #111114;
        --muted-color: #6e6e75;
        --sheen-hi: rgba(255, 255, 255, 0.5);
        --sheen-mid: rgba(255, 255, 255, 0.14);
        --sheen-rim: rgba(255, 255, 255, 0.9);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        user-select: none;
        -webkit-user-select: none;
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter",
          "Helvetica Neue", Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      /* the document is 100lvh tall — one browser-bar-height taller than
         the visible area on iOS — so a swipe lets Safari collapse its bars
         and the page bleeds edge to edge */
      html {
        height: 100%;
        background-color: var(--bg-color);
        transition: background-color 0.5s ease;
      }
      body {
        height: 100vh;
        height: 100lvh;
        width: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        background-color: var(--bg-color);
        color: var(--text-color);
        transition:
          background-color 0.5s ease,
          color 0.5s ease;
      }

      /* flat field the glass refracts. Absolute, not fixed: liquidGL's
         rasteriser skips fixed elements. */
      .ambient {
        position: absolute;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        height: 100lvh;
        z-index: 0;
        pointer-events: none;
        background: var(--bg-color);
        transition: background-color 0.5s ease;
      }

      /* ————— glass finish shared by every lens —————
         liquidGL paints the refractive face on its canvas; this layer adds
         the soft diagonal sheen + bright top rim that reads as glass over a
         plain background (the liquidGL homepage pill look). */
      .lens {
        position: relative;
        overflow: clip;
        will-change: transform;
      }
      .lens::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        z-index: 2;
        pointer-events: none;
        background: linear-gradient(
          125deg,
          var(--sheen-hi) 0%,
          var(--sheen-mid) 34%,
          rgba(255, 255, 255, 0) 62%
        );
        box-shadow: inset 0 1px 1px var(--sheen-rim);
        transition: background 0.5s ease;
      }
      .lens > * {
        position: relative;
        z-index: 3;
      }

      /* ————— theme toggle ————— */
      .top-nav {
        position: fixed;
        top: 0;
        right: 0;
        padding: 32px 40px;
        z-index: 9999;
      }
      #theme-toggle {
        /* liquidGL disables pointer events on its lenses; keep it clickable */
        pointer-events: auto !important;
        width: 53px;
        height: 53px;
        border: none;
        background: transparent;
        border-radius: 999px;
        color: var(--text-color);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        outline: none;
        -webkit-tap-highlight-color: transparent;
        /* same spring as the email pill */
        transition:
          color 0.5s ease,
          transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      #theme-toggle:hover {
        transform: scale(1.04);
      }
      #theme-toggle:active {
        transform: scale(0.97);
      }
      #theme-toggle svg {
        position: absolute;
        z-index: 3;
        width: 17px;
        height: 17px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
        transition:
          transform 0.6s cubic-bezier(0.4, 0, 0.2, 1),
          opacity 0.4s ease;
      }
      #sun-icon {
        opacity: 1;
        transform: rotate(0deg);
      }
      #moon-icon {
        opacity: 0;
        transform: rotate(-90deg);
      }
      [data-theme="light"] #sun-icon {
        opacity: 0;
        transform: rotate(90deg);
      }
      [data-theme="light"] #moon-icon {
        opacity: 1;
        transform: rotate(0deg);
      }

      /* ————— card + email pill, fixed overlays centred on the viewport ————— */
      .card-anchor,
      .pill-anchor {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        justify-content: center;
        align-items: center;
        padding-bottom: 140px;
        pointer-events: none;
      }
      .pill-anchor a {
        pointer-events: auto;
        transform: translateY(160px);
      }

      .card {
        width: min(340px, calc(100vw - 48px));
        height: 200px;
        border-radius: 1rem;
        padding: 1.25rem 1.5rem;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 5;
      }
      .card-face {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        text-align: center;
      }

      .name {
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter",
          "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-size: 2.4rem;
        font-weight: 700;
        letter-spacing: -0.022em;
        color: var(--text-color);
        transition: color 0.5s ease;
      }
      .name span {
        font-family: inherit;
      }
      .tagline {
        font-size: 1.02rem;
        font-weight: 400;
        color: var(--muted-color);
        transition: color 0.5s ease;
      }

      .name .caret {
        display: inline-block;
        width: 2px;
        height: 0.8em;
        border-radius: 1px;
        background: currentColor;
        margin-left: 4px;
        vertical-align: -0.05em;
        animation: caret-pulse 1s ease-in-out infinite;
      }
      @keyframes caret-pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.15;
        }
      }
      .name .caret.done {
        animation: none;
        opacity: 1;
        transition: opacity 0.35s ease 0.45s;
      }
      .name .caret.done.gone {
        opacity: 0;
      }

      /* retro six-colour Apple stripes — secret (type "apple") */
      .name.retro #name-text {
        background: linear-gradient(
          180deg,
          #61bb46 0% 16.6%,
          #fdb827 16.6% 33.3%,
          #f5821f 33.3% 50%,
          #e03a3e 50% 66.6%,
          #963d97 66.6% 83.3%,
          #009ddc 83.3% 100%
        );
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
      }

      .email-wrap {
        display: inline-block;
        text-decoration: none;
      }
      .email-pill {
        border-radius: 999px;
        padding: 1.05rem 2.6rem;
        z-index: 5;
        transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      .email-wrap:hover .email-pill {
        transform: scale(1.04);
      }
      .email-wrap:active .email-pill {
        transform: scale(0.97);
      }
      .email-pill span {
        color: var(--text-color);
        font-size: 0.98rem;
        font-weight: 500;
        letter-spacing: -0.01em;
        transition: color 0.5s ease;
      }

      /* ————— footer: long glass pill pinned to the visual viewport ————— */
      footer.lens {
        position: fixed;
        left: 24px;
        right: 24px;
        bottom: calc(24px + env(safe-area-inset-bottom));
        z-index: 9999;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1.05rem 2rem;
        border-radius: 999px;
        color: var(--muted-color);
        font-size: 0.78rem;
        font-weight: 500;
        letter-spacing: 0.01em;
        transition: color 0.5s ease;
      }
      /* the lens disables pointer events on the footer; the clock stays
         clickable to flip SF ↔ UTC */
      #clock-wrap {
        pointer-events: auto;
        cursor: pointer;
      }

      @media (max-width: 768px) {
        .top-nav {
          padding: calc(14px + env(safe-area-inset-top)) 18px 18px;
        }
        #theme-toggle {
          width: 48px;
          height: 48px;
        }
        .card-anchor,
        .pill-anchor {
          padding-bottom: 120px;
        }
        .name {
          font-size: 2.2rem;
        }
        .tagline {
          font-size: 0.95rem;
        }
        .pill-anchor a {
          transform: translateY(150px);
        }
        .email-pill {
          padding: 0.95rem 2.2rem;
        }
        .email-pill span {
          font-size: 0.92rem;
        }
        footer.lens {
          left: 14px;
          right: 14px;
          bottom: calc(14px + env(safe-area-inset-bottom));
          padding: 0.85rem 1.2rem;
          font-size: 0.68rem;
          gap: 12px;
        }
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="scripts/liquidGL.js" defer></script>
  </head>
  <body>
    <div class="ambient"></div>

    <div class="top-nav">
      <button id="theme-toggle" class="lens lg-flat" aria-label="Toggle Theme">
        <svg id="sun-icon" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg id="moon-icon" viewBox="0 0 24 24">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </div>

    <div class="card-anchor">
      <div class="card lens lg-card" id="card">
        <div class="card-face">
          <h1 class="name" id="name"
            ><span id="name-text"></span><span class="caret" id="caret"></span
          ></h1>
          <p class="tagline">building things on the internet</p>
        </div>
      </div>
    </div>

    <div class="pill-anchor">
      <a href="mailto:x@nabeel.ca" class="email-wrap">
        <div class="email-pill lens lg-flat">
          <span>x@nabeel.ca</span>
        </div>
      </a>
    </div>

    <footer class="lens lg-flat">
      <div class="footer-left">
        © <span id="year"></span> Nabeel. All rights reserved
      </div>
      <div class="footer-right" id="clock-wrap">
        San Francisco, CA. <span id="clock">00:00:00</span>
      </div>
    </footer>

    <script>
      // ————— theme —————
      const root = document.documentElement;
      const themeToggle = document.getElementById("theme-toggle");
      function syncChrome() {
        const light = root.getAttribute("data-theme") === "light";
        document
          .getElementById("theme-color")
          .setAttribute("content", light ? "#ececee" : "#101014");
      }
      function setTheme(theme) {
        if (theme === "dark") root.removeAttribute("data-theme");
        else root.setAttribute("data-theme", "light");
        localStorage.setItem("theme", theme);
        syncChrome();
        // re-photograph the flat field once the colour transition has
        // finished (plus a safety pass), so the glass takes the new colour
        const r = window.__liquidGLRenderer__;
        if (r && r.captureSnapshot) {
          setTimeout(() => r.captureSnapshot(), 560);
          setTimeout(() => r.captureSnapshot(), 1100);
        }
      }
      // light is the default (set in markup); dark only when chosen
      if (localStorage.getItem("theme") === "dark") root.removeAttribute("data-theme");
      syncChrome();
      themeToggle.addEventListener("click", () =>
        setTheme(root.getAttribute("data-theme") === "light" ? "dark" : "light"),
      );

      // ————— typewriter: human rhythm, caret leaves right after —————
      const nameEl = document.getElementById("name");
      const nameText = document.getElementById("name-text");
      const caret = document.getElementById("caret");
      const NAME = "Nabeel";
      const RHYTHM = [0, 95, 150, 80, 120, 70];
      let typeIndex = 0;
      function typeNext() {
        nameText.textContent = NAME.slice(0, ++typeIndex);
        if (typeIndex < NAME.length) {
          setTimeout(typeNext, RHYTHM[typeIndex] + Math.random() * 35);
        } else {
          caret.classList.add("done");
          requestAnimationFrame(() =>
            requestAnimationFrame(() => caret.classList.add("gone")),
          );
        }
      }
      setTimeout(typeNext, 450);

      // ————— fireworks (type "nabeel"), rendered in front of the glass —————
      // main-thread canvas: the worker/OffscreenCanvas path can fail silently
      const fireworks = confetti.create(null, { resize: true, useWorker: false });
      function fireworksShow() {
        const end = Date.now() + 2500;
        const colors = ["#ff2d78", "#ff7a1a", "#b06bff", "#4db8ff", "#ffffff"];
        (function fire() {
          fireworks({
            particleCount: 45,
            startVelocity: 32,
            spread: 360,
            ticks: 70,
            gravity: 0.9,
            origin: { x: 0.15 + Math.random() * 0.7, y: 0.15 + Math.random() * 0.4 },
            colors,
            zIndex: 20000,
            disableForReducedMotion: true,
          });
          if (Date.now() < end) setTimeout(fire, 180 + Math.random() * 140);
        })();
      }

      // ————— typed secrets —————
      let inputBuffer = "";
      const secrets = {
        dark: () => setTheme("dark"),
        light: () => setTheme("light"),
        nabeel: fireworksShow,
        apple: () => nameEl.classList.toggle("retro"),
      };
      window.addEventListener("keydown", (e) => {
        if (e.key.length !== 1) return;
        inputBuffer = (inputBuffer + e.key.toLowerCase()).slice(-10);
        for (const word in secrets) {
          if (inputBuffer.includes(word)) {
            secrets[word]();
            inputBuffer = "";
          }
        }
      });

      // ————— footer clock (click flips SF ↔ UTC) —————
      document.getElementById("year").textContent = new Date().getFullYear();
      let clockZone = "America/Los_Angeles";
      const clockWrap = document.getElementById("clock-wrap");
      clockWrap.addEventListener("click", () => {
        clockZone = clockZone === "UTC" ? "America/Los_Angeles" : "UTC";
        clockWrap.firstChild.textContent =
          clockZone === "UTC" ? "\n        UTC. " : "\n        San Francisco, CA. ";
        updateClock();
      });
      function updateClock() {
        document.getElementById("clock").textContent = new Intl.DateTimeFormat([], {
          timeZone: clockZone,
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hour12: false,
        }).format(new Date());
      }
      setInterval(updateClock, 1000);
      updateClock();

      // ————— liquid glass: liquidGL WebGL refraction (MIT, NaughtyDuk) —————
      // Cursor tilt on the card only. No device sensors, no permission prompts.
      // Two calls share one renderer but keep separate options — the library
      // hands every lens of a call the same options object.
      document.addEventListener("DOMContentLoaded", () => {
        if (typeof liquidGL !== "function") return;
        const base = {
          snapshot: ".ambient",
          // a flat field needs no 2x snapshot; 1x keeps theme recaptures fast
          resolution: 1,
          shadow: true,
          specular: true,
          reveal: "fade",
        };
        // card: liquidGL demo-2 bank card, verbatim
        liquidGL({
          ...base,
          target: ".lg-card",
          refraction: 0,
          bevelDepth: 0.1,
          bevelWidth: 0.17,
          frost: 2,
          tilt: true,
          tiltFactor: 25,
          tiltEase: 550,
        });
        // pill / toggle / footer: the liquidGL homepage pill, verbatim
        liquidGL({
          ...base,
          target: ".lg-flat",
          refraction: 0.01,
          bevelDepth: 0.119,
          bevelWidth: 0.057,
          frost: 0,
          tilt: false,
        });
      });

      console.log(
        "%cNABEEL",
        "color: #ffffff; font-family: monospace; font-size: 24px; font-weight: bold; padding: 10px 0;",
      );
      console.log(
        "%cYou found the console. Try typing 'apple' on the page ;)",
        "color: #a3a3a3; font-family: monospace; font-size: 12px;",
      );
    </script>
  </body>
</html>
