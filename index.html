<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" id="theme-color" content="#f8f8fb" />
    <title>Nabeel</title>

    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="favicon.png" />

    <meta name="title" content="Nabeel" />
    <meta name="description" content="Personal site of Nabeel." />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nabeel.ca/" />
    <meta property="og:title" content="Nabeel" />
    <meta property="og:description" content="Personal site of Nabeel." />
    <meta property="og:image" content="https://nabeel.ca/og-image.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://nabeel.ca/" />
    <meta name="twitter:title" content="Nabeel" />
    <meta name="twitter:description" content="Personal site of Nabeel." />
    <meta name="twitter:image" content="https://nabeel.ca/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        /* exact video base colour so iOS bar areas continue the wallpaper */
        --bg-color: #0e0f1a;
        --text-color: #f5f5f7;
        --muted-color: #9a9aa2;
        --footer-color: #86868b;

        /* liquid glass tokens */
        --glass-bg: rgba(255, 255, 255, 0.06);
        --glass-bg-strong: rgba(255, 255, 255, 0.1);
        --glass-stroke: rgba(255, 255, 255, 0.25);
        --glass-inner: inset 0 1px 1px rgba(255, 255, 255, 0.3),
          inset 0 -1px 1px rgba(255, 255, 255, 0.08);
        --card-shadow: 0 40px 90px rgba(0, 0, 0, 0.55),
          0 8px 24px rgba(0, 0, 0, 0.35);
        --emboss-hi: rgba(255, 255, 255, 0.35);
        --emboss-lo: rgba(0, 0, 0, 0.5);

        --blob-a: rgba(255, 20, 120, 0.5);
        --blob-b: rgba(255, 100, 20, 0.32);
        --blob-c: rgba(130, 60, 255, 0.42);
        --blob-d: rgba(0, 170, 255, 0.22);

        --glint-core: rgba(255, 255, 255, 0.95);
        --glint-mid: rgba(255, 255, 255, 0.3);
      }

      [data-theme="light"] {
        --bg-color: #f8f8fb;
        --text-color: #101014;
        --muted-color: #55555c;
        --footer-color: #6b6b72;

        --glass-bg: rgba(255, 255, 255, 0.34);
        --glass-bg-strong: rgba(255, 255, 255, 0.5);
        --glass-stroke: rgba(255, 255, 255, 0.75);
        --glass-inner: inset 0 1px 1px rgba(255, 255, 255, 0.95),
          inset 0 -1px 1px rgba(255, 255, 255, 0.4);
        --card-shadow: 0 40px 90px rgba(60, 50, 100, 0.28),
          0 8px 24px rgba(60, 50, 100, 0.12);
        --emboss-hi: rgba(255, 255, 255, 0.9);
        --emboss-lo: rgba(0, 0, 0, 0.18);

        --blob-a: rgba(255, 90, 160, 0.45);
        --blob-b: rgba(255, 160, 80, 0.35);
        --blob-c: rgba(150, 110, 255, 0.4);
        --blob-d: rgba(60, 190, 255, 0.3);

        --glint-core: rgba(60, 80, 215, 1);
        --glint-mid: rgba(60, 80, 215, 0.4);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        user-select: none;
        -webkit-user-select: none;
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter",
          "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-style: normal !important;
        -webkit-font-smoothing: antialiased;
      }

      html,
      body {
        height: 100%;
        height: 100dvh;
        width: 100%;
        overflow: hidden;
        position: fixed;
      }

      body {
        background-color: var(--bg-color);
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        align-items: center;
        color: var(--text-color);
        transition:
          background-color 0.4s ease,
          color 0.4s ease;
      }

      /* demo wallpaper the glass refracts — a real <img> so liquidGL's
         rasteriser captures it; static, the lenses provide the motion */
      .ambient {
        /* absolute, NOT fixed: liquidGL's rasteriser skips fixed elements,
           which left the lenses refracting an empty snapshot.
           100lvh spans the LARGE viewport so the wallpaper spills under
           iOS's status/address bars like apple.com */
        position: absolute;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        height: 100lvh;
        z-index: 0;
        pointer-events: none;
        overflow: hidden;
        /* poster painted underneath so a stalled video never shows black */
        background: #0e0f1a url("assets/wallpaper_dark_v4.jpg") center / cover
          no-repeat;
      }
      [data-theme="light"] .ambient {
        background: #f8f8fb url("assets/wallpaper_light_v4.jpg") center / cover
          no-repeat;
      }
      .ambient img,
      .ambient video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        /* hidden until truly playing so a stalled video never covers the poster */
        opacity: 0;
        transition: opacity 0.5s ease;
      }
      .ambient video.live {
        opacity: 1;
      }

      /* shared liquid glass recipe */
      .glass {
        position: relative;
        background: var(--glass-bg);
        -webkit-backdrop-filter: blur(26px) saturate(190%);
        backdrop-filter: blur(26px) saturate(190%);
        border: 1px solid var(--glass-stroke);
        box-shadow: var(--glass-inner);
        transition:
          background 0.4s ease,
          border-color 0.4s ease;
      }

      /* rim glint that follows the cursor */
      .glass::after {
        content: "";
        position: absolute;
        inset: -1px;
        border-radius: inherit;
        pointer-events: none;
        padding: 1.5px;
        background: radial-gradient(
          180px circle at var(--mx, 50%) var(--my, 50%),
          var(--glint-core) 0%,
          var(--glint-mid) 40%,
          transparent 70%
        );
        -webkit-mask:
          linear-gradient(#000 0 0) content-box,
          linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
        mask:
          linear-gradient(#000 0 0) content-box,
          linear-gradient(#000 0 0);
        mask-composite: exclude;
        opacity: 0;
        transition: opacity 0.5s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .glass:hover::after {
        opacity: 1;
      }

      .top-nav {
        position: fixed;
        top: 0;
        right: 0;
        padding: 32px 40px;
        z-index: 9999;
        /* NOTE: no mix-blend here — the sun/moon icon animates, and
           Chrome stalls repaints of dynamic content inside blended
           fixed containers */
      }

      /* same glass treatment as the email pill, just round */
      #theme-toggle {
        z-index: 5;
        /* stay clickable even though the lens disables pointer events */
        pointer-events: auto !important;
        overflow: clip;
        will-change: transform;
        border: none;
        background: none;
        border-radius: 999px;
        color: #ffffff;
        cursor: pointer;
        width: 53px;
        height: 53px;
        display: flex;
        align-items: center;
        justify-content: center;
        outline: none;
        -webkit-tap-highlight-color: transparent;
      }
      #theme-toggle:active {
        opacity: 0.8;
      }

      #theme-toggle svg {
        position: absolute;
        z-index: 3;
        width: 17px;
        height: 17px;
        fill: none;
        stroke: currentColor;
        filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.55));
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
        transition:
          transform 0.6s cubic-bezier(0.4, 0, 0.2, 1),
          opacity 0.4s ease;
      }

      #sun-icon {
        opacity: 1;
        transform: rotate(0deg);
      }
      #moon-icon {
        opacity: 0;
        transform: rotate(-90deg);
      }

      [data-theme="light"] #sun-icon {
        opacity: 0;
        transform: rotate(90deg);
      }
      [data-theme="light"] #moon-icon {
        opacity: 1;
        transform: rotate(0deg);
      }

      /* fixed overlay directly on body, exactly like the demo's
         card-anchor: no intermediate stacking context, so the
         difference blend composites against the lens canvas */
      .card-anchor {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 36px;
        /* keep the glass over the saturated part of the wallpaper,
           not the washed-out bright blob lower down */
        padding-bottom: 140px;
        pointer-events: none;
        mix-blend-mode: difference;
      }
      .card-anchor a {
        pointer-events: auto;
      }

      /* pill lives outside the blended anchor so its text stays uniform */
      .pill-anchor {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        justify-content: center;
        align-items: center;
        padding-bottom: 140px;
        pointer-events: none;
        /* text adapts to whatever the glass sits over, like the card */
        mix-blend-mode: difference;
      }
      .pill-anchor a {
        pointer-events: auto;
        transform: translateY(160px);
      }

      /* ————— the bank card (liquidGL demo-2, 1:1) ————— */
      .card {
        width: min(340px, calc(100vw - 48px));
        height: 200px;
        border-radius: 1rem;
        padding: 1.25rem 1.5rem;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 0.5rem;
        position: relative;
        overflow: clip;
        will-change: transform;
        z-index: 5;
      }
      .card > * {
        position: relative;
        z-index: 3;
      }

      /* clean personal card face */
      .card {
        justify-content: center;
        align-items: center;
      }
      .card-face {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        text-align: center;
      }

      /* everything in the Apple stack: real SF Pro on Apple devices */
      .name {
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter",
          "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-size: 2.4rem;
        font-weight: 700;
        letter-spacing: -0.022em;
        color: #ffffff;
        margin: 0;
      }
      .name span {
        font-family: inherit;
      }

      .tagline {
        font-size: 1.02rem;
        font-weight: 400;
        letter-spacing: 0.002em;
        color: #ffffff;
        opacity: 0.55;
        margin: 0;
      }

      .stack {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 36px;
      }

      /* liquid glass email pill (demo-3 style) */
      .email-wrap {
        display: inline-block;
        text-decoration: none;
        pointer-events: auto;
        will-change: transform;
      }
      .email-pill {
        position: relative;
        z-index: 5;
        border-radius: 999px;
        padding: 1.05rem 2.6rem;
        overflow: clip;
        will-change: transform;
        transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      .email-wrap:hover .email-pill {
        transform: scale(1.05);
      }
      .email-wrap:active .email-pill {
        transform: scale(0.97);
      }
      .email-pill span {
        position: relative;
        z-index: 3;
        color: #ffffff;
        font-size: 0.98rem;
        font-weight: 500;
        letter-spacing: -0.01em;
      }

      .name {
        transition: opacity 0.3s ease;
      }
      .name.fading {
        opacity: 0;
      }
      .name span {
        font-family: inherit;
      }

      .name .caret {
        display: inline-block;
        width: 2px;
        height: 0.8em;
        border-radius: 1px;
        background: #ffffff;
        margin-left: 4px;
        vertical-align: -0.05em;
        /* soft pulse, not a hard blink */
        animation: caret-pulse 1s ease-in-out infinite;
      }
      @keyframes caret-pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.15;
        }
      }
      .name .caret.done {
        animation: none;
        opacity: 1;
        transition: opacity 0.35s ease 0.45s;
      }
      .name .caret.done.gone {
        opacity: 0;
      }

      /* the custom reveal fade is disabled: inside the blended fixed
         anchor Chrome fails to repaint after the transition, and
         liquidGL already fades its lenses in */
      .reveal {
        opacity: 1;
      }

      /* retro six-color Apple stripes — secret */
      .name.retro #name-text {
        background: linear-gradient(
          180deg,
          #61bb46 0% 16.6%,
          #fdb827 16.6% 33.3%,
          #f5821f 33.3% 50%,
          #e03a3e 50% 66.6%,
          #963d97 66.6% 83.3%,
          #009ddc 83.3% 100%
        );
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
        text-shadow: none;
      }

      /* long glass button spanning the bottom, matching the email pill */
      footer {
        position: relative;
        z-index: 9999;
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: calc(100% - 48px);
        margin: 0 24px 24px;
        padding: 1.05rem 2rem;
        border-radius: 999px;
        overflow: clip;
        will-change: transform;
        mix-blend-mode: difference;
        color: #ffffff;
        font-size: 0.78rem;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      footer > * {
        position: relative;
        z-index: 3;
      }
      /* the lens disables pointer events on the footer; the clock stays
         clickable to flip SF ↔ UTC */
      #clock-wrap {
        pointer-events: auto;
        cursor: pointer;
      }

      @media (max-width: 768px) {
        .top-nav {
          padding: calc(14px + env(safe-area-inset-top)) 20px 18px;
        }
        footer {
          width: calc(100% - 24px);
          margin: 0 12px calc(12px + env(safe-area-inset-bottom));
          padding: 11px 18px;
          font-size: 0.6rem;
        }
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="scripts/liquidGL.js" defer></script>
  </head>
  <body>
    <div class="ambient">
      <video
        id="wallpaper"
        src="assets/wallpaper_light_v4.mp4"
        poster="assets/wallpaper_light_v4.jpg"
        autoplay
        muted
        loop
        playsinline
      ></video>
    </div>

    <div class="top-nav">
      <button id="theme-toggle" class="liquidGL-flat" aria-label="Toggle Theme">
        <svg id="sun-icon" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg id="moon-icon" viewBox="0 0 24 24">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </div>

    <div class="card-anchor">
      <div class="card liquidGL" id="card">
        <div class="card-face">
          <h1 class="name" id="name"
            ><span id="name-text"></span><span class="caret" id="caret"></span
          ></h1>
          <p class="tagline reveal">building things on the internet</p>
        </div>
      </div>

    </div>

    <div class="pill-anchor">
      <a href="mailto:x@nabeel.ca" class="email-wrap reveal">
        <div class="email-pill liquidGL-flat">
          <span>x@nabeel.ca</span>
        </div>
      </a>
    </div>

    <footer class="liquidGL-flat">
      <div class="footer-left">
        © <span id="year"></span> Nabeel. All rights reserved
      </div>
      <div class="footer-right" id="clock-wrap">
        San Francisco, CA. <span id="clock">00:00:00</span>
      </div>
    </footer>

    <script>
      const themeToggle = document.getElementById("theme-toggle");
      const body = document.body;
      const wallpaper = document.getElementById("wallpaper");
      const WALLPAPERS = {
        dark: "assets/wallpaper_dark_v4.mp4",
        light: "assets/wallpaper_light_v4.mp4",
      };
      // reveal the video only once frames are actually rendering
      wallpaper.addEventListener("timeupdate", () => {
        if (wallpaper.currentTime > 0.05) wallpaper.classList.add("live");
      });
      // honour reduced motion: freeze the drifting wallpaper
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        wallpaper.autoplay = false;
        wallpaper.addEventListener("canplay", () => wallpaper.pause());
      }
      function applyWallpaper() {
        const next =
          body.getAttribute("data-theme") === "light"
            ? WALLPAPERS.light
            : WALLPAPERS.dark;
        wallpaper.classList.remove("live");
        wallpaper.src = next;
        const playAttempt = wallpaper.play();
        if (playAttempt && playAttempt.catch) playAttempt.catch(() => {});
        // tint the browser chrome to match the wallpaper
        document
          .getElementById("theme-color")
          .setAttribute(
            "content",
            body.getAttribute("data-theme") === "light" ? "#f8f8fb" : "#0e0f1a",
          );
        // re-photograph the page so the glass refracts the new wallpaper
        wallpaper.onload = () => {
          const r = window.__liquidGLRenderer__;
          if (r && r.captureSnapshot) r.captureSnapshot();
        };
      }
      // light is the default; dark only when explicitly chosen
      if (localStorage.getItem("theme") !== "dark")
        body.setAttribute("data-theme", "light");
      applyWallpaper();

      themeToggle.addEventListener("click", () => {
        if (body.getAttribute("data-theme") === "light") {
          body.removeAttribute("data-theme");
          localStorage.setItem("theme", "dark");
        } else {
          body.setAttribute("data-theme", "light");
          localStorage.setItem("theme", "light");
        }
        applyWallpaper();
      });

      const nameEl = document.getElementById("name");
      const nameText = document.getElementById("name-text");
      const caret = document.getElementById("caret");
      const NAME_HTML = "Nabeel";

      // natural typewriter: human rhythm, caret leaves right after
      document
        .querySelectorAll(".reveal")
        .forEach((el) => el.classList.add("shown"));
      const NAME = "Nabeel";
      // hand-tuned per-keystroke delays (ms) — quick, slightly uneven
      const RHYTHM = [0, 95, 150, 80, 120, 70];
      let typeIndex = 0;
      function typeNext() {
        nameText.textContent = NAME.slice(0, ++typeIndex);
        if (typeIndex < NAME.length) {
          setTimeout(typeNext, RHYTHM[typeIndex] + Math.random() * 35);
        } else {
          caret.classList.add("done");
          requestAnimationFrame(() =>
            requestAnimationFrame(() => caret.classList.add("gone")),
          );
        }
      }
      setTimeout(typeNext, 450);

      const greetings = [
        "Nabeel",
        "hello",
        "salaam",
        "bonjour",
        "hola",
        "ciao",
        "こんにちは",
      ];
      let greetIndex = 0;
      let nameClicks = 0;

      // fireworks show, rendered in front of the glass
      // (main-thread canvas: the worker/OffscreenCanvas path can fail silently)
      const fireworks = confetti.create(null, { resize: true, useWorker: false });
      const triggerHello = () => {
        const end = Date.now() + 2500;
        const colors = ["#ff2d78", "#ff7a1a", "#b06bff", "#4db8ff", "#ffffff"];
        (function fire() {
          fireworks({
            particleCount: 45,
            startVelocity: 32,
            spread: 360,
            ticks: 70,
            gravity: 0.9,
            origin: {
              x: 0.15 + Math.random() * 0.7,
              y: 0.15 + Math.random() * 0.4,
            },
            colors,
            zIndex: 20000,
            disableForReducedMotion: true,
          });
          if (Date.now() < end) setTimeout(fire, 180 + Math.random() * 140);
        })();
      };

      // name-click greeting easter egg — disabled for now
      // nameEl.addEventListener("click", () => {
      //   nameClicks++;
      //   nameEl.classList.add("fading");
      //   setTimeout(() => {
      //     greetIndex = (greetIndex + 1) % greetings.length;
      //     if (greetings[greetIndex] === "Nabeel") {
      //       nameText.innerHTML = NAME_HTML;
      //     } else {
      //       nameText.textContent = greetings[greetIndex];
      //     }
      //     nameEl.classList.remove("fading");
      //   }, 300);
      //   if (nameClicks === 5) {
      //     triggerHello();
      //     nameClicks = 0;
      //   }
      // });

      let inputBuffer = "";
      const secrets = {
        dark: () => {
          body.removeAttribute("data-theme");
          localStorage.setItem("theme", "dark");
        },
        light: () => {
          body.setAttribute("data-theme", "light");
          localStorage.setItem("theme", "light");
        },
        nabeel: () => {
          triggerHello();
        },
        apple: () => {
          nameEl.classList.toggle("retro");
        },
      };

      window.addEventListener("keydown", (e) => {
        if (e.key.length === 1) {
          inputBuffer += e.key.toLowerCase();
          if (inputBuffer.length > 10) inputBuffer = inputBuffer.substring(1);
          for (const word in secrets) {
            if (inputBuffer.includes(word)) {
              secrets[word]();
              inputBuffer = "";
            }
          }
        }
      });

      document.getElementById("year").textContent = new Date().getFullYear();
      let clockZone = "America/Los_Angeles";
      const clockWrap = document.getElementById("clock-wrap");
      clockWrap.style.cursor = "pointer";
      clockWrap.addEventListener("click", () => {
        clockZone = clockZone === "UTC" ? "America/Los_Angeles" : "UTC";
        clockWrap.firstChild.textContent =
          clockZone === "UTC" ? "\n        UTC. " : "\n        San Francisco, CA. ";
        updateClock();
      });
      function updateClock() {
        const formatter = new Intl.DateTimeFormat([], {
          timeZone: clockZone,
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hour12: false,
        });
        document.getElementById("clock").textContent = formatter.format(
          new Date(),
        );
      }
      setInterval(updateClock, 1000);
      updateClock();

      // ————— true liquid glass: liquidGL WebGL refraction (MIT, NaughtyDuk) —————
      // Cursor tilt only — no device sensors, no permission prompts, ever.
      document.addEventListener("DOMContentLoaded", () => {
        if (typeof liquidGL === "function") {
          // two calls share one renderer but keep separate options
          // (the library hands every lens of a call the SAME options
          // object, so per-lens mutation corrupts the others)
          // card: demo-2 params, cursor tilt + moving specular
          liquidGL({
            snapshot: ".ambient",
            target: ".liquidGL",
            resolution: 1.5,
            refraction: 0,
            bevelDepth: 0.1,
            bevelWidth: 0.17,
            frost: 2,
            shadow: true,
            specular: true,
            reveal: "fade",
            tilt: true,
            tiltFactor: 25,
            tiltEase: 550,
          });
          // toggle, pill, footer: demo-3 pill glass (thick frost, specular
          // sheen) but no tilt — glassy at rest, inert to the cursor
          liquidGL({
            snapshot: ".ambient",
            target: ".liquidGL-flat",
            refraction: 0,
            bevelDepth: 0.1,
            bevelWidth: 0.17,
            frost: 7,
            shadow: true,
            specular: true,
            reveal: "fade",
            tilt: false,
          });
        }

      });

      // rim glint tracking on small glass elements
      document.querySelectorAll(".glass").forEach((el) => {
        el.addEventListener("pointermove", (e) => {
          const r = el.getBoundingClientRect();
          el.style.setProperty("--mx", e.clientX - r.left + "px");
          el.style.setProperty("--my", e.clientY - r.top + "px");
        });
      });

      console.log(
        "%cNABEEL",
        "color: #ffffff; font-family: monospace; font-size: 24px; font-weight: bold; padding: 10px 0;",
      );
      console.log(
        "%cYou found the console. Try typing 'apple' on the page ;)",
        "color: #a3a3a3; font-family: monospace; font-size: 12px;",
      );
    </script>
  </body>
</html>
